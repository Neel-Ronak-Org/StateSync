# config/flags.toml
# Which models play which role, and the one pipeline switch. Read at process start, and copied into
# each question's state when it arrives, so a question runs with the settings it started with.
# Numbers and limits are in config/statesync.toml.

# ── Models ────────────────────────────────────────────────────────────────────
# Every model is reached through an OpenAI-compatible chat endpoint (llm/adapters/openai_compat_adapter.py).
# A role names "endpoint:model"; the endpoint's address and the name of its key file are below. Keys are
# Docker secret files (secrets/<key_secret>), never written here. To use another provider, add an
# [llm.endpoints.<name>] table and point the roles at it.
[llm.openai_compat]
fallback             = "off"    # "off": a failed call is an error, never silently answered by another model
require_served_match = true     # refuse an answer from a model other than the one asked for

[llm.endpoints.cheaperinference]
base_url   = "https://api.cheaperinference.com/v1"
key_secret = "cheaperinference_api_key"
served_aliases = { "qwen-3-8-27b" = ["qwen3.8-27b"] }   # the label the server reports for this model
[llm.endpoints.cheaperinference.reasoning_effort]
"gpt-oss-120b" = "low"          # a reasoning model: low effort is enough for SQL and answers, and faster
[llm.endpoints.cheaperinference.extra_body."qwen-3-8-27b"]
reasoning = { enabled = false } # the small model answers directly, without a thinking phase

# The roles (orchestrator/llm/provider.py):
[llm.models.openai_compat]
supervisor  = "cheaperinference:qwen-3-8-27b"   # the LLM router, used only when Jev cannot be reached
decomposer  = "cheaperinference:qwen-3-8-27b"   # splits a two-source question; drafts a workspace's table notes
sql         = "cheaperinference:gpt-oss-120b"   # writes and corrects SQL
synthesizer = "cheaperinference:gpt-oss-120b"   # writes the answer

# ── Pipeline ──────────────────────────────────────────────────────────────────
[pipeline]
jev = "on"   # "on": Jev routes questions and re-ranks passages. "off": the LLM router decides and passages keep
             # the search's order (for running without a Jev key; Jev also falls back to these on its own failure)
