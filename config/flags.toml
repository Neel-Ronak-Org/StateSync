# config/flags.toml
# Feature flags (Appendix 3). All flags are read at query entry into flags_snapshot
# (A2) or at process start. Changing a flag here does not require a BD entry —

# ── LLM provider (D2 seam) ────────────────────────────────────────────────────
# provider = "local"      → Ollama (offline-capable, dev default)
# provider = "anthropic"  → Anthropic API (required for all graded runs / metrics)
#
# IMPORTANT: Numbers from a 7-8B local model are NOT representative and must
# never appear in reported metrics or panel demos. Always run on anthropic for
# any result you intend to show.
[llm]
# 2026-09-26: "groq" by owner decision (docs/V3_PLAN.md 0.4). The configured
# local model was not installed on the dev machine, and v3 demos on a hosted
# model. "local" still works offline once `ollama pull qwen2.5:7b` is done.
provider = "groq"           # "local" | "anthropic" | "azure" | "gemini" | "groq"
ollama_url = "http://host.docker.internal:11434"

# Azure OpenAI / AI Foundry (BD1 seam, third implementation).
# NOT secrets -- an endpoint is not sensitive, and keeping it in config keeps
# it visible to the config-discipline checks. The KEY goes in the Docker
# secret secrets/azure_openai_api_key (or AZURE_OPENAI_API_KEY).
#
# endpoint:    Foundry portal → Deployments → your deployment → Endpoint.
#              Looks like https://<resource>.openai.azure.com/
# api_version: shown next to the deployment in the portal.
[llm.azure]
endpoint    = ""            # REPLACE — startup refuses while this is empty
api_version = "2024-10-21"

# Groq (fifth implementation, OpenAI-compatible). NOT a secret -- the key goes
# in secrets/groq_api_key (or GROQ_API_KEY).
[llm.groq]
base_url = "https://api.groq.com/openai/v1"

# Models listed here are REASONING models: they get this effort level, and
# models.groq_reasoning_headroom_tokens on top of the role's max_tokens so the
# reasoning cannot eat the visible answer. Models not listed get neither --
# the accepted values differ by model family.
[llm.groq.reasoning_effort]
"openai/gpt-oss-120b" = "low"

# provider = "openai_compat" (llm/adapters/openai_compat_adapter.py): named OpenAI-compatible
# endpoints, each role pinned to "endpoint:model", with an explicit fallback policy. NOT the
# shipped provider (that stays "groq"); this is the route to free tiers and paid credits.
# Keys are Docker secret files named by key_secret (mount them in docker-compose.yml first).
[llm.openai_compat]
fallback             = "off"    # "off" (every measurement) | "same_model" | "any"
require_served_match = true     # refuse an answer from a model other than the one requested

[llm.endpoints.groq]
base_url   = "https://api.groq.com/openai/v1"
key_secret = "groq_api_key"
[llm.endpoints.groq.reasoning_effort]
"openai/gpt-oss-120b" = "low"

[llm.endpoints.openrouter]
base_url   = "https://openrouter.ai/api/v1"
key_secret = "openrouter_api_key"
[llm.endpoints.openrouter.reasoning_effort]
"openai/gpt-oss-120b" = "low"

[llm.endpoints.gemini_studio]          # Google AI Studio's OpenAI-compatible endpoint
base_url   = "https://generativelanguage.googleapis.com/v1beta/openai/"
key_secret = "gemini_api_key"

[llm.endpoints.local_router]           # e.g. OmniRoute on this machine (compression OFF)
base_url   = "http://host.docker.internal:20128/v1"
key_secret = "local_router_api_key"

[llm.models.openai_compat]
supervisor        = "groq:qwen/qwen3.8-27b"
sql               = "groq:openai/gpt-oss-120b"
synthesizer       = "groq:openai/gpt-oss-120b"
memory_summarizer = "groq:qwen/qwen3.8-27b"
normalizer        = "groq:qwen/qwen3.8-27b"
decomposer        = "groq:qwen/qwen3.8-27b"
judge             = "groq:openai/gpt-oss-120b"
rewriter          = "groq:qwen/qwen3.8-27b"

# THREE LOCAL MODELS MEASURED, all seven roles, corrected fixture, 25 queries.
# 7b ships because a 14b buys NOTHING and costs 3x the latency:
#
#   model                strict EX   standard EX   val recall   latency
#   qwen2.5:7b   (gen)     52.0%        60.0%        81.2%       ~20s
#   qwen2.5:14b  (gen)     52.0%        60.0%        78.8%       ~60s
#   qwen2.5-coder:14b      48.0%        52.0%        73.8%       ~61s
#
#   SIZE effect (7b -> 14b, both general):  +0.0pp
#   TUNE effect (general -> coder, at 14b): -8.0pp
#
# Doubling the parameter count changed WHICH queries pass (gained c2g_13/16,
# lost c2g_07/15) without changing HOW MANY. The coder tune is the entire
# penalty. Read together with the hosted-model probe (+20pp), the local gain is
# not smooth in size: 7b -> 14b is flat, and the step change is somewhere ABOVE
# what a 24GB laptop can hold. Buying a bigger local model is not the lever.
#
# Both 14b models stay pulled and deliberately unconfigured. Do not re-try
# either without a NEW reason; each costs ~40 minutes to relearn this.
#
# TWO configurations tested, both worse. The first claim here generalised from
# ONE of them and the owner caught it, so the second was measured too:
#
#   A) sql+synthesizer on 14b, ORIGINAL fixture
#        strict 36.0 -> 36.0 (+0.0pp), standard 44.0 -> 40.0 (-4.0pp),
#        value recall 74.0 -> 66.3 (-7.7pp)
#   B) ALL SEVEN roles on 14b, CORRECTED fixture
#        strict 52.0 -> 48.0 (-4.0pp), standard 60.0 -> 52.0 (-8.0pp),
#        value recall 81.2 -> 73.8 (-7.4pp), gained c2g_16, lost 07/09/15
#
# Worse in both, and MORE so when applied everywhere. Latency ~61s/query vs
# ~20s. The reasoning for the swap was sound -- code-tuned model, every
# remaining M4 failure is SQL -- and the measurement refuted it twice. Third
# instance of that pattern after schema comments and projection discipline.
# Do not re-try on the same reasoning; it costs ~40 minutes per configuration.
#
# Sizing note for anything else tried here: M5 Air, 24GB, NO ACTIVE COOLING.
# 9.0GB (a 14b q4) fits alongside the stack; a 32B q4 (~19GB) does not -- it
# would swap and thermally throttle across a 30-minute run. 14B is the ceiling.
#
# NOTE: models live in the NATIVE Ollama.app (127.0.0.1:11434, IPv4), not the
# dockerized one. Docker binds *:11434 on IPv6, so `localhost` from the host
# reaches the CONTAINER while `host.docker.internal` from a container reaches
# the NATIVE app. `ollama pull` on the host targets the native one, which is
# the one this config uses. See docs/limitations.md.
[llm.models.local]
supervisor        = "qwen2.5:7b"
sql               = "qwen2.5:7b"
synthesizer       = "qwen2.5:7b"
memory_summarizer = "qwen2.5:7b"   # C1: trajectory insight generation
normalizer        = "qwen2.5:7b"   # D: language detection + entity-preserving rewrite
decomposer        = "qwen2.5:7b"   # E1: hybrid query decomposition into sub-tasks
judge             = "qwen2.5:7b"   # E1: bench_grounding.py context precision / faithfulness scoring
rewriter          = "qwen2.5:7b"   # cycle 007: contextual query rewriting (multi-turn)

# DEPLOYMENT names, not model ids. Azure addresses whatever you named the
# deployment in the portal; two deployments of the same base model with
# different names are different values here. A 404 DeploymentNotFound at the
# first query almost always means these do not match the portal.
# The defaults below assume you named them after the models, which is the
# portal's own suggestion — change them if you named them anything else.
[llm.models.azure]
supervisor        = "gpt-4o-mini"
sql               = "gpt-4o"
synthesizer       = "gpt-4o"
memory_summarizer = "gpt-4o-mini"
normalizer        = "gpt-4o-mini"
decomposer        = "gpt-4o-mini"
judge             = "gpt-4o"
rewriter          = "gpt-4o-mini"  # cycle 007: contextual query rewriting (multi-turn)

# Gemini addresses models by PUBLISHED NAME -- no deployment-name indirection,
# unlike Azure. Free tier is rate-limited per MINUTE, so a full fixture run
# will hit 429s; the adapter backs off and retries (models.gemini_max_retries).
# Raise `sql` to a stronger model if the free tier allows it -- that is the
# role where M4's remaining failures live.
# PINNED, deliberately not "gemini-flash-latest". An alias silently changes
# under you; a metric has to name the model that produced it or it is not
# reproducible. Verified live 2026-08-17 against this key: 3.6-flash, 3.5-flash,
# 3-flash-preview and flash-lite all generate; gemini-3.7-flash returned 503
# UNAVAILABLE; every "pro" model returned 429 -- the FREE TIER HAS NO PRO QUOTA.
# So flash is not a cost choice here, it is the only tier available.
[llm.models.gemini]
# ROLE ASSIGNMENT DRIVEN BY MEASURED LIMITS, not guesses. From the AI Studio
# "Rate limits by model" dashboard (2026-08-17):
#
#   tier          RPM    RPD     TPM
#   Flash          5      20     250K
#   Flash-Lite    15     500     250K
#
# TPM is irrelevant here -- peak observed use was 19.9K of 250K (8%).
# The binding constraints are RPM (fixed by models.gemini_rpm pacing) and RPD.
#
# EACH MODEL HAS ITS OWN BUDGET, so three roles on three DIFFERENT Flash models
# get 20 RPD each rather than sharing one. An 18-query run needs ~18 supervisor
# and ~18 synthesizer calls -- both inside 20 -- so both get the strong tier.
#
# `sql` is the role that decides the number, so it gets a Flash model too, even
# though retries can push it to ~22 calls against a 20 RPD cap. That is a
# deliberate trade: BETTER QUALITY ON 16-18 QUERIES BEATS WORSE QUALITY ON 18,
# and diagnose_m4 now checkpoints after every query, so hitting the wall banks
# everything completed rather than losing the run (it lost one that way).
#
# The normalizer is DISABLED for these English-only fixtures rather than given a
# model: D-V3 proved English passes the gate byte-identical 20/20, so the call
# is a measured no-op costing ~24% of the request budget.
supervisor        = "gemini-3.5-flash"
sql               = "gemini-3.5-flash-lite"  # 500 RPD. The sql role makes 3-4 calls/query (interrogation draft + generation + retries), so a 20-RPD Flash model is exhausted by ~5 queries -- measured, not estimated.
synthesizer       = "gemini-3-flash-preview"  # NOT "gemini-3-flash": that is the DASHBOARD display name and 404s as an API id
memory_summarizer = "gemini-3.1-flash-lite"
normalizer        = "gemini-3.1-flash-lite"
decomposer        = "gemini-3.5-flash-lite"
judge             = "gemini-3.5-flash-lite"
rewriter          = "gemini-3.1-flash-lite"  # cycle 007: contextual query rewriting (multi-turn).
# An 8th role tightens the free-tier RPD budget further (see the block comment
# above) -- only relevant if provider=gemini is actually selected; unexercised
# by this cycle's own measurements, which run on the shipped local provider.

[llm.models.anthropic]
supervisor        = "claude-opus-4-5"
sql               = "claude-sonnet-4-5"
synthesizer       = "claude-sonnet-4-5"
memory_summarizer = "claude-sonnet-4-5"   # C1: trajectory insight generation
normalizer        = "claude-sonnet-4-5"   # D: language detection + entity-preserving rewrite
decomposer        = "claude-sonnet-4-5"   # E1: hybrid query decomposition into sub-tasks
judge             = "claude-opus-4-5"     # E1: bench_grounding.py context precision / faithfulness scoring
rewriter          = "claude-sonnet-4-5"   # cycle 007: contextual query rewriting (multi-turn)

# Published Groq model ids. ROLE ASSIGNMENT DRIVEN BY MEASURED LIMITS: every
# model on the owner's key has its OWN budget of 8,000 tokens/min and 1,000
# requests/day (response headers, 2026-09-26). The two roles whose output the
# user reads -- SQL and the answer -- get the strongest model; the short
# classification-style roles get a fast one. Two budgets instead of one.
[llm.models.groq]
supervisor        = "qwen/qwen3.8-27b"
sql               = "openai/gpt-oss-120b"
synthesizer       = "openai/gpt-oss-120b"
memory_summarizer = "qwen/qwen3.8-27b"
normalizer        = "qwen/qwen3.8-27b"
decomposer        = "qwen/qwen3.8-27b"
judge             = "openai/gpt-oss-120b"
rewriter          = "qwen/qwen3.8-27b"

# ─────────────────────────────────────────────────────────────────────────────
# that is the point of the flag system. Changing the *existence* of a flag
# (adding or removing) does require a BD entry.

# BD6/readiness call: default false until graded re-baseline; memory-on regresses
# M2 + golden rate on the local model. A/B still run by toggling.
# NB: keep `enabled` on the line directly below [memory] -- bench_memory.py's
# set_memory_enabled() matches exactly that shape and refuses to guess otherwise.
[memory]
enabled                         = false  # D13 control path for M1/M2; see comment above

[normalization]
enabled                         = true   # D13 control path for M3
provider                        = "prompt"  # D2 provider slot; resolved at process start

[spatial]
provider                        = "digipin"  # Spatial resolver slot; resolved at process start

[schema_retriever]
provider                        = "direct"   # D7 CSR-RAG slot; resolved at process start
# Which corpus the SQL agent is shown. "public" = A5's synthetic ONDC schema
# (the shipped default); "olist" = the real-data corpus from migration 007.
# Only `public` participates in the A5 fingerprint, so pointing this at olist
# does NOT move it -- but trajectory memory keyed on that fingerprint is then
# meaningless, so keep memory.enabled=false for olist runs.
target_schema                   = "public"

[ingestion]
source                          = "local"    # IngestionSource slot (A8, Appendix 4); resolved by scripts/ingest.py at operator-run time

[retrieval]
[retrieval.hybrid_decomposition]
enabled                         = true   # D7 cost gate; read at query entry

[evaluation]
[evaluation.vision_scorer]
enabled                         = false  # D11 stretch; resolved at process start

# Phase 3b lean-pipeline experiments (docs/V3_PLAN.md D-v3-16, scope review).
# Each ships at today's behaviour; a variant becomes the default only after the
# Groq baseline (scripts/eval_groq.py) shows accuracy holds and cost falls.
# Guarded by scripts/shipped_flags.py SHIPPED_DEFAULTS.
[pipeline]
language_gate                   = "llm"      # "llm": ask the model every time | "script": only for non-English text
router_mode                     = "always"   # "always" | "when_documents": skip routing for sources without documents
sql_draft_mode                  = "llm"      # "llm": draft + live sampling | "profiles": one SQL call with column profiles
synth_style                     = "full"     # "full" | "short": <= 3 sentences, no chart proposal, numbers formatted by rule
answer_checks                   = "off"      # "off" | "on": deterministic checks after the SQL runs (join fan-out, date coverage, truncation, empty aggregates)
templates                       = "off"      # "off" | "on": answer from a template of an approved query when only the values differ (the "compiled" tier)
number_grounding                = "on"       # "off" | "on": trace every figure in the prose to a result cell, total, the question or a cited passage; unmatched figures become a caveat (never changes SQL or rows)
repair_loop                     = "off"      # "off" | "evidence" | "plain": one repair attempt when figure grounding (or a join fan-out) flags an answer; "plain" withholds the evidence (study control). repair_loop.py, docs/research/evidence_tiers_study.md RQ4
retrieval_mode                  = "dense"    # "dense" | "hybrid": keyword (BM25) leg fused with the dense search by reciprocal rank fusion (docs/specs/rag_v2.md Phase D)
doc_scope                       = "all"      # "all" | "dataset": sample-corpus documents limited to the question's dataset (prefixes: retrieval.dataset_document_prefixes in statesync.toml); uploads unaffected (Phase E)
doc_abstain                     = "off"      # "off" | "on": the docs route answers "not found" without a model call when nothing relevant was retrieved (Phase E; thresholds: retrieval.abstain_min_* in statesync.toml)
rerank                          = "bge"      # "off" | "minilm" | "bge": re-score the top candidates with a cross-encoder (docs/specs/rag_v3.md). "bge" since 2026-10-03 (owner): +16.0 pts page hit@5 on FinanceBench, ~4.5 s per search on the Mac GPU
query_rewrite                   = "off"      # "off" | "llm": the docs route searches with a short rewrite of the question from the normaliser model (docs/specs/rag_v3.md)

[tenancy]
enforced                        = false  # D6; threading is mandatory even when false

[routing]
# Three registered routes. "docs" and "hybrid" resolve to stub nodes in Phase B.
# Values are resolver keys that map into the SpecialistNode registry (A8).
table                           = ["sql", "docs", "hybrid"]
