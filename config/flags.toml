# config/flags.toml
# Feature flags (Appendix 3). All flags are read at query entry into flags_snapshot
# (A2) or at process start. Changing a flag here does not require a BD entry —

# ── LLM provider (D2 seam) ────────────────────────────────────────────────────
# provider = "local"      → Ollama (offline-capable, dev default)
# provider = "anthropic"  → Anthropic API (required for all graded runs / metrics)
#
# IMPORTANT: Numbers from a 7-8B local model are NOT representative and must
# never appear in reported metrics or panel demos. Always run on anthropic for
# any result you intend to show.
[llm]
provider = "local"          # "local" | "anthropic" | "azure"
ollama_url = "http://host.docker.internal:11434"

# Azure OpenAI / AI Foundry (BD1 seam, third implementation).
# NOT secrets -- an endpoint is not sensitive, and keeping it in config keeps
# it visible to the config-discipline checks. The KEY goes in the Docker
# secret secrets/azure_openai_api_key (or AZURE_OPENAI_API_KEY).
#
# endpoint:    Foundry portal → Deployments → your deployment → Endpoint.
#              Looks like https://<resource>.openai.azure.com/
# api_version: shown next to the deployment in the portal.
[llm.azure]
endpoint    = ""            # REPLACE — startup refuses while this is empty
api_version = "2024-10-21"

[llm.models.local]
supervisor        = "qwen2.5:7b"
sql               = "qwen2.5:7b"
synthesizer       = "qwen2.5:7b"
memory_summarizer = "qwen2.5:7b"   # C1: trajectory insight generation
normalizer        = "qwen2.5:7b"   # D: language detection + entity-preserving rewrite
decomposer        = "qwen2.5:7b"   # E1: hybrid query decomposition into sub-tasks
judge             = "qwen2.5:7b"   # E1: bench_grounding.py context precision / faithfulness scoring

# DEPLOYMENT names, not model ids. Azure addresses whatever you named the
# deployment in the portal; two deployments of the same base model with
# different names are different values here. A 404 DeploymentNotFound at the
# first query almost always means these do not match the portal.
# The defaults below assume you named them after the models, which is the
# portal's own suggestion — change them if you named them anything else.
[llm.models.azure]
supervisor        = "gpt-4o-mini"
sql               = "gpt-4o"
synthesizer       = "gpt-4o"
memory_summarizer = "gpt-4o-mini"
normalizer        = "gpt-4o-mini"
decomposer        = "gpt-4o-mini"
judge             = "gpt-4o"

[llm.models.anthropic]
supervisor        = "claude-opus-4-5"
sql               = "claude-sonnet-4-5"
synthesizer       = "claude-sonnet-4-5"
memory_summarizer = "claude-sonnet-4-5"   # C1: trajectory insight generation
normalizer        = "claude-sonnet-4-5"   # D: language detection + entity-preserving rewrite
decomposer        = "claude-sonnet-4-5"   # E1: hybrid query decomposition into sub-tasks
judge             = "claude-opus-4-5"     # E1: bench_grounding.py context precision / faithfulness scoring

# ─────────────────────────────────────────────────────────────────────────────
# that is the point of the flag system. Changing the *existence* of a flag
# (adding or removing) does require a BD entry.

# BD6/readiness call: default false until graded re-baseline; memory-on regresses
# M2 + golden rate on the local model. A/B still run by toggling.
# NB: keep `enabled` on the line directly below [memory] -- bench_memory.py's
# set_memory_enabled() matches exactly that shape and refuses to guess otherwise.
[memory]
enabled                         = false  # D13 control path for M1/M2; see comment above

[normalization]
enabled                         = true   # D13 control path for M3
provider                        = "prompt"  # D2 provider slot; resolved at process start

[spatial]
provider                        = "digipin"  # Spatial resolver slot; resolved at process start

[schema_retriever]
provider                        = "direct"   # D7 CSR-RAG slot; resolved at process start

[ingestion]
source                          = "local"    # IngestionSource slot (A8, Appendix 4); resolved by scripts/ingest.py at operator-run time

[retrieval]
[retrieval.hybrid_decomposition]
enabled                         = true   # D7 cost gate; read at query entry

[evaluation]
[evaluation.vision_scorer]
enabled                         = false  # D11 stretch; resolved at process start

[tenancy]
enforced                        = false  # D6; threading is mandatory even when false

[routing]
# Three registered routes. "docs" and "hybrid" resolve to stub nodes in Phase B.
# Values are resolver keys that map into the SpecialistNode registry (A8).
table                           = ["sql", "docs", "hybrid"]
