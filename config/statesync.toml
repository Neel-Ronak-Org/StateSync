[answer_checks]
# pipeline.answer_checks = "on". Deterministic checks on an executed SELECT.
fanout_retry_max          = 1       # retries after a confirmed join fan-out; then the answer ships with a caveat
key_column_suffixes       = ["_id", "id"]   # candidate single-column keys, verified unique before use

[templates]
# pipeline.templates = "on" (docs/V3_PLAN.md Phase 3c slice 3). Templates come only
# from approved examples; a question is matched by one short model call.
max_slots                 = 8       # an example with more literals than this gets no template
