# config/statesync.toml
# Locked constants (Appendix 1). Changing any value here requires a BD entry (A0.3).
# Loaded by orchestrator/config_loader.py — never read inline in agent source.

[mcp]
# Schemas that SQL written by the model may never name on a built-in dataset:
# StateSync's own state, uploaded documents (the reader role can read them for
# retrieval, and RLS isolates tenants, not users), the BM25 side table, the
# simulator's private plans, and the system catalogs (security review 2026-10-01).
internal_schemas          = ["session_state", "workspace_docs", "search", "live_sim",
                             "pg_catalog", "information_schema", "pg_toast"]
# Raised 15 -> 20 on 2026-09-26 (docs/V3_PLAN.md decision log, D-v3-1): the
# supervisor never sees MCP methods (D1 decoupled routing from MCP), so this
# guards API sprawl, not model accuracy. 16 in use after tiles.manage.
tool_ceiling              = 20
# The only MCP methods the evaluator's own token may call (mcp/service_auth.py rule 5);
# it may not pass `dataset` either, so it never reaches a connected database.
evaluator_methods         = ["data.run_select"]
statement_timeout_ms      = 15000
max_rows_default          = 1000
max_rows_hard_cap         = 5000
sample_rows_hard_cap      = 20
session_idle_timeout_ms   = 60000
network_overhead_s        = 5       # added to statement_timeout for client-side timeout
connect_timeout_s         = 10      # httpx connect timeout to MCP service
pool_min_size             = 2       # psycopg3 AsyncConnectionPool minimum connections
pool_max_size             = 10      # psycopg3 AsyncConnectionPool maximum connections
sample_rows_default_limit = 5       # default row count for data.sample_rows (A4.3)
sample_rows_max_columns   = 12      # maximum columns in a sample_rows column list
history_get_turns_hard_cap = 20     # cycle 007: history.get_recent_turns input bound (BD10)
# Session browser (orchestrator GET /sessions, GET /sessions/{id}). Local-dev
# only -- both routes 404 unless STATESYNC_SESSION_BROWSER is set. These bound
# the page size the UI asks for; history_get_turns_hard_cap still clamps the
# per-session read server-side regardless of what is requested here.
session_browser_list_limit = 50     # conversations listed in the history sheet
session_browser_turn_limit = 100    # turns fetched when resuming one conversation
# Rows persisted per turn for replay (migration 012). A capped PREVIEW, not the
# result set: max_rows_default is 1000 and the hard cap 5000, so storing every
# turn in full grows session_state.conversation_turns without bound. The true
# count is stored separately so a truncated preview is never shown as complete.
history_row_preview_max   = 100
# Full result sets persisted per turn in session_state.turn_rows (migration 015).
# Stored in a separate table to keep history.get_recent_turns fast on follow-up
# queries. Three independent bounds govern storage, because one alone is not enough:
# history_full_rows_max bounds ROW COUNT, history_full_rows_max_bytes bounds
# PAYLOAD SIZE (a 200-row result of wide text columns can dwarf a 1000-row result
# of integers, so a row cap alone does not bound storage), retention_days bounds
# AGE, and prune_batch_limit bounds the work done per write so pruning can never
# become a long transaction on the user-facing path.
history_full_rows_enabled          = true
history_full_rows_max              = 1000
history_full_rows_max_bytes        = 1048576
history_full_rows_retention_days   = 30
history_prune_batch_limit          = 200
# Audit log retention, enforced by scripts/prune_audit_log.py run as the
# migrator (docs/V3_PLAN.md 0.7). Not pruned on write: that would need DELETE
# for the app role, which could then erase its own audit trail.
audit_retention_days               = 180
# history.append_turn assigns the turn number itself (docs/V3_PLAN.md 0.1); two
# concurrent writes in one session can pick the same number, and the loser
# retries up to this many times before reporting the turn as not recorded.
history_append_max_attempts        = 3
# Free-text detail persisted per audit event (migration 013). An audit record
# must never become a storage-amplification vector across high request volumes,
# so detail is clamped to this ceiling. The cap is enforced at the write in
# mcp/tools/history_tools.py.
audit_detail_max_chars    = 500

[sql]
retry_max                 = 3       # attempts after the first; 4 executions maximum
timeout_retry_max         = 3       # retries after a statement timeout (3 = today's behaviour; the scope review suggests 1)
interrogation_max_samples = 4
max_sql_length            = 8000
max_tokens_supervisor     = 128     # enough for {"route":"sql"} classification
max_tokens_sql            = 1024    # SQL generation
max_tokens_synthesizer    = 1024    # prose answer generation
max_tokens_memory_summary = 256     # C1: insight/tables/join_path JSON, capped by memory.insight_max_chars
max_tokens_normalizer     = 512     # D: detected_language/confidence/normalized_query/preserved_entities JSON
max_tokens_decomposer     = 512     # E1: sub-question decomposition JSON, hybrid route only
max_tokens_judge          = 1024    # E1: bench_grounding.py context precision / faithfulness JSON
max_tokens_rewriter       = 512     # cycle 007: needs_context/rewritten_query/guessed JSON (BD10)
rewrite_history_turns     = 3       # how many prior turns rewrite_node loads per query
synthesizer_preview_rows  = 50      # rows shown to synthesizer LLM (context window budget)
answer_max_chars          = 4000    # A7 answer_text character cap
chart_max_data_rows       = 5000    # A7 data.values maxItems
# E2 Deliverable 1: "populated chart WHERE A CHART IS APPROPRIATE". A result
# has to have enough shape to plot -- a single scalar ("how many orders?" -> 1
# row, 1 column) is an answer, not a chart, and forcing one would be noise.
# The Synthesizer may still return null above these floors; these only gate
# out results that cannot be charted at all.
chart_min_rows            = 2       # need at least two points to show a shape
chart_min_columns         = 2       # need a dimension and a measure
chart_max_transforms      = 8       # A7 transform maxItems
chart_min_dimension       = 100     # A7 chart width/height minimum (px)
chart_max_width           = 1600    # A7 chart width maximum (px)
chart_max_height          = 1200    # A7 chart height maximum (px)

[memory]
provider                  = "qdrant"
collection                = "agentsm_trajectories"
embedding_dim             = 1024
embedding_model           = "mxbai-embed-large"  # BD2; served by the mcp-only ollama container
embedding_timeout_s       = 30      # mcp -> ollama /api/embeddings HTTP timeout
similarity_threshold      = 0.82    # below this, treated as a miss
top_k                     = 3
top_k_max                 = 5       # A4.8 memory.get_trajectory input bound
insight_max_chars         = 1200

[normalization]
provider                  = "prompt"
detect_confidence_min     = 0.70    # below this, treat as "other" and pass through
# pipeline.language_gate = "script": the model is asked only when the question has
# Devanagari script or at least hinglish_min_markers common Hindi function words.
hinglish_min_markers      = 2
hinglish_markers          = ["hai", "hain", "kya", "kitne", "kitna", "kitni", "kaun", "kaunsa", "kaunse",
                             "kahan", "kab", "kaise", "ke", "ka", "ki", "ko", "se", "mein", "aur", "nahi",
                             "wale", "wali", "wala", "kiye", "kiya", "diya", "gaya", "gayi", "hua", "hui",
                             "raha", "rahi", "rahe", "sabse", "zyada", "kam", "abhi", "pichle", "agle"]

