[connections]
# Your own Postgres (docs/V3_PLAN.md Phase 3c slice 6, migration 026,
# mcp/connections.py). A connection is saved only when its login is read-only.
max_per_principal           = 20         # was 10; raised 2026-10-03 for BIRD (one connection per database, 11)
name_max_chars              = 60
host_max_chars              = 255
field_max_chars             = 128      # database, user and schema names
