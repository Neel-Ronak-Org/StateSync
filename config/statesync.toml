# config/statesync.toml
# Locked constants (Appendix 1). Changing any value here requires a BD entry (A0.3).
# Loaded by orchestrator/config_loader.py — never read inline in agent source.

[mcp]
tool_ceiling              = 15      # Strategy: 10–15; 9 in use, headroom deliberate
statement_timeout_ms      = 15000
max_rows_default          = 1000
max_rows_hard_cap         = 5000
sample_rows_hard_cap      = 20
session_idle_timeout_ms   = 60000
network_overhead_s        = 5       # added to statement_timeout for client-side timeout
connect_timeout_s         = 10      # httpx connect timeout to MCP service
pool_min_size             = 2       # psycopg3 AsyncConnectionPool minimum connections
pool_max_size             = 10      # psycopg3 AsyncConnectionPool maximum connections
sample_rows_default_limit = 5       # default row count for data.sample_rows (A4.3)
sample_rows_max_columns   = 12      # maximum columns in a sample_rows column list
history_get_turns_hard_cap = 20     # cycle 007: history.get_recent_turns input bound (BD10)

[sql]
retry_max                 = 3       # attempts after the first; 4 executions maximum
interrogation_max_samples = 4
max_sql_length            = 8000
max_tokens_supervisor     = 128     # enough for {"route":"sql"} classification
max_tokens_sql            = 1024    # SQL generation
max_tokens_synthesizer    = 1024    # prose answer generation
max_tokens_memory_summary = 256     # C1: insight/tables/join_path JSON, capped by memory.insight_max_chars
max_tokens_normalizer     = 512     # D: detected_language/confidence/normalized_query/preserved_entities JSON
max_tokens_decomposer     = 512     # E1: sub-question decomposition JSON, hybrid route only
max_tokens_judge          = 1024    # E1: bench_grounding.py context precision / faithfulness JSON
max_tokens_rewriter       = 512     # cycle 007: needs_context/rewritten_query/guessed JSON (BD10)
rewrite_history_turns     = 3       # how many prior turns rewrite_node loads per query
synthesizer_preview_rows  = 50      # rows shown to synthesizer LLM (context window budget)
answer_max_chars          = 4000    # A7 answer_text character cap
chart_max_data_rows       = 5000    # A7 data.values maxItems
# E2 Deliverable 1: "populated chart WHERE A CHART IS APPROPRIATE". A result
# has to have enough shape to plot -- a single scalar ("how many orders?" -> 1
# row, 1 column) is an answer, not a chart, and forcing one would be noise.
# The Synthesizer may still return null above these floors; these only gate
# out results that cannot be charted at all.
chart_min_rows            = 2       # need at least two points to show a shape
chart_min_columns         = 2       # need a dimension and a measure
chart_max_transforms      = 8       # A7 transform maxItems
chart_min_dimension       = 100     # A7 chart width/height minimum (px)
chart_max_width           = 1600    # A7 chart width maximum (px)
chart_max_height          = 1200    # A7 chart height maximum (px)

[memory]
provider                  = "qdrant"
collection                = "agentsm_trajectories"
embedding_dim             = 1024
embedding_model           = "mxbai-embed-large"  # BD2; served by the mcp-only ollama container
embedding_timeout_s       = 30      # mcp -> ollama /api/embeddings HTTP timeout
similarity_threshold      = 0.82    # below this, treated as a miss
top_k                     = 3
top_k_max                 = 5       # A4.8 memory.get_trajectory input bound
insight_max_chars         = 1200

[normalization]
provider                  = "prompt"
detect_confidence_min     = 0.70    # below this, treat as "other" and pass through

[spatial]
provider                  = "digipin"
default_radius_m          = 5000
srid                      = 4326
roundtrip_tolerance_m     = 4.0
roundtrip_sample_size     = 200
roundtrip_rng_seed        = 20260807

[retrieval]
chunk_target_tokens       = 512
chunk_overlap_tokens      = 64
semantic_top_k            = 8
semantic_top_k_max        = 25      # A4.6 vector.semantic_search input bound
decomposition_max_hops    = 3
embedding_model           = "mxbai-embed-large"  # E1: same model as memory's, own name per concern (A0.2)
embedding_dim             = 1024    # must match document_chunks.embedding VECTOR(1024), A5
embedding_timeout_s       = 30      # mcp -> ollama /api/embeddings HTTP timeout, ingestion + query-time
citation_max_chunks       = 3       # synthesizer: max kind:"chunk" citations deterministically emitted

[scoring]
recall_weight             = 0.70    # spec score; recall over precision per VegaChat
precision_weight          = 0.30
mark_weight               = 0.40
encoding_weight           = 0.45
transform_weight          = 0.15
# ExecutionAccuracyScorer (BIRD/Spider "EX"). SQL result order is unspecified
# without ORDER BY, so the published definition compares result sets
# order-insensitively; set true only for a fixture whose ground truth pins an
# order and means it.
ex_order_sensitive        = false

[evaluation]
scorers                   = ["spec", "execution"]
golden_run_schedule_cron  = "0 * * * *"
history_retention_runs    = 200
# F1 Scope: "the Scorer registry with SpecScorer and ExecutionScorer
# registered and enabled" -- these name the fixtures whose shape matches
# each registered scorer's own need (reference_spec for spec, ground_truth_sql
# for execution). See docs/spec-gaps.md GAP-8 for why "the full golden set"
# is defined this way, since F1 Scope does not itself name a fixture.
spec_scorer_fixture       = "phase_e2.json"
execution_scorer_fixture  = "phase_c2.json"
history_default_limit     = 20      # GET /history default page size
# Per-query HTTP budget for the evaluation pipeline. Deliberately NOT derived
# from mcp.statement_timeout_ms: that bounds a single SQL statement, whereas a
# pipeline query is a full graph traversal (normalize + route + generate +
# execute + synthesize, several LLM calls). Reusing the MCP timeout gave 75s,
# under which 15 of 150 spec queries (10%) timed out across the 5-run trend.
query_timeout_s           = 300

# D11 Vision Score. A sub-table of [evaluation], so it must follow every
# bare [evaluation] key -- TOML closes a table when the next header appears.
# `model` is empty until a vision-capable model exists in the deployment, and
# is deliberately NOT defaulted to a text model: a text model asked to judge a
# picture it cannot see returns a confident, meaningless number.
[evaluation.vision_scorer]
model                     = ""
render_scale              = 2.0     # PNG scale factor passed to vl-convert
mark_weight               = 0.40    # mirrors the deterministic scorer's split
encoding_weight           = 0.45
readability_weight        = 0.15

[tenancy]
default_tenant            = "t_capstone_default"
enforced                  = false   # D6; threading is mandatory even when false
# Admission control for tenancy.enforced=true. A tenant_id outside this list is
# refused at the MCP boundary rather than silently served an empty result set,
# so a typo in X-Tenant-ID surfaces as an error instead of as "no data".
allowed_tenants           = ["t_capstone_default"]
# The relational business tables (orders, sellers, fulfillments, ...) carry NO
# tenant discriminator column, so they CANNOT be row-isolated. Only the
# document plane (documents, document_chunks) and the trajectory plane carry
# tenant_id. Enabling enforcement while the relational plane is shared is a
# real decision with real consequences, so it must be stated explicitly here;
# startup refuses otherwise rather than implying an isolation that does not
# exist. Adding tenant_id to the relational tables would change the A5 schema
# fingerprint and invalidate every stored trajectory under D4 -- see
# docs/open_items.md.
relational_plane_shared_ack = false

[experiment]
# F-V2 over-exposure experiment (M9). Surface sizes reuse mcp.tool_ceiling's
# own scale (9 = current registered tool count, 15 = the configured ceiling)
# as decoy-capability-count targets injected into the Supervisor's own
# classification prompt -- see docs/spec-gaps.md GAP-7 for why: M9 measures
# Supervisor ROUTING accuracy, and D1 decoupled that 3-route classification
# from MCP's own tool list, so the surface that can actually move this
# metric is the Supervisor's own prompt, not MCP's registered RPC methods.
tool_ceiling_surfaces        = [9, 15, 25, 40]
tool_ceiling_runs_per_level  = 5
# Stratified subsample (not the full 60) for local-model runtime -- 4/route,
# 4 levels x 5 runs x 12 queries = 240 calls vs 1200 for the full set.
# Reasoned tradeoff, recorded in docs/phase_f_log.md; the F-V2 BASELINE
# measurement (single pass, the actual >=90% pass condition) always runs
# the full 60-query set.
tool_ceiling_subsample_per_route = 4

[models]
temperature               = 0.0
seed                      = 20260807
# LLM provider choice is set in flags.toml; model name is also there.
ollama_timeout_s          = 120     # generous — local inference can be slow
# Azure OpenAI. Much shorter than the local timeout: a hosted frontier model
# answering in 120s means something is wrong, not that it is thinking.
azure_timeout_s           = 60
# The SDK retries 429/5xx itself. Kept low deliberately -- a graded run that
# silently retries is a graded run whose token accounting is wrong.
azure_max_retries         = 2
# Gemini. The FREE tier is limited per MINUTE, and a full fixture run issues
# ~5.2 LLM calls per query, so 429s are expected mid-run rather than
# exceptional. Retries use exponential backoff from the base delay below.
# Scoring a rate limit as a wrong answer would be a pure measurement artifact.
gemini_timeout_s          = 120
gemini_max_retries        = 5
gemini_retry_base_delay_s = 4.0
# Gemini 3.x are THINKING models and thinking tokens count against
# max_output_tokens. "minimal" is the only control that actually zeroes them on
# gemini-3.6-flash (thinking_budget=0 is rejected; thinking_budget=N does not
# constrain; "low" still spends ~119). Empty string omits the parameter.
# Raising this requires raising the [sql] max_tokens_* caps too -- a BD under
# A0.3 -- because thinking silently eats the visible-output budget.
gemini_thinking_level     = "minimal"
# CLIENT-SIDE PACING. The free tier's binding constraint is REQUESTS PER MINUTE,
# not per day -- measured from the AI Studio dashboard: Flash models 5 RPM /
# 20 RPD, Flash-Lite 15 RPM / 500 RPD, TPM 250K (peak use 19.9K, never close).
# The pipeline fires ~4 calls back to back per query, so with no pacing it
# exceeds 5 RPM on the FIRST query and every later 429 is self-inflicted.
# Retry-with-backoff reacts to that; pacing prevents it.
#
# Set to the LOWEST tier in use (Flash = 5). Raise to 15 when every configured
# model is Flash-Lite. A wrong value here costs throughput, never correctness.
gemini_rpm                = 5
