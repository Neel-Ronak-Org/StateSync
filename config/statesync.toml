[library]
# The account-level document library (docs/V3_PLAN.md Phase 3c slice 5, D-v3-17,
# migration 024). Uploads are parsed by the isolated `parser` service, chunked
# by the orchestrator and embedded by the MCP.
max_upload_bytes            = 20971520   # 20 MiB, per file, checked by the orchestrator AND the parser
max_pages                   = 600        # a PDF with more pages is refused. 600 (was 300; owner, 2026-10-02): 6 of FinanceBench's 84 real filings run 304-549 pages; each reads in under 8 s and stays under max_chars
max_chars                   = 2000000    # extracted text per file
parse_timeout_s             = 60         # the parser's child process is killed after this
parse_memory_mb             = 768        # address-space limit of that child process
parse_cpu_s                 = 60         # CPU-time limit of that child process
blocks_time_budget_s        = 25         # the layout pass stops here; later pages fall back to flat text
parser_request_timeout_s    = 90         # orchestrator -> parser HTTP timeout
content_types               = ["application/pdf", "text/plain", "text/markdown"]
# Chunking (orchestrator/library_ingest.py). mxbai-embed-large reads 512 tokens,
# roughly 2,000 characters of English; chunks stay under that with room to spare.
chunk_chars                 = 1400
chunk_overlap_chars         = 200
chunk_min_chars             = 40         # shorter fragments are dropped (page numbers, headers)
# Layout-aware parsing and chunking (docs/specs/rag_v2.md Phases B and C). The parser
# reads the heading/paragraph thresholds; the orchestrator reads the chunker keys.
heading_size_ratio          = 1.15       # a line this much larger than the body font is a heading
heading_max_chars           = 120        # a longer line is never a heading
heading_bold_max_words      = 12         # a bold line of at most this many words is a heading
paragraph_gap_ratio         = 1.5        # line pitch above this many line heights starts a new paragraph
chunker                     = "paragraph"  # "paragraph" (flat pages, shipped) | "layout" (headings, tables, breadcrumbs)
layout_chunk_chars          = 1200       # layout chunker: text body budget (breadcrumb and overlap come on top)
layout_overlap_chars        = 150        # layout chunker: tail of the previous chunk, same section and page only
table_chunk_max_chars       = 700        # layout chunker: a larger table is split by rows, header repeated. 700 (was 2400, 2026-10-02):
                                         # mxbai-embed-large reads at most 512 tokens and silently drops the rest; Markdown tables run
                                         # ~2 chars/token (1,000 chars = 497 tokens, 1,200 = 512 = truncated), so 700 + a 300-char lead-in
                                         # + the breadcrumb stays near 450 tokens. Prose runs ~5 chars/token (1,400 chars = 278).
table_context_max_chars     = 300        # layout chunker: the paragraph before a table rides along if this short
section_max_chars           = 300        # the MCP refuses a longer section path
embed_batch                 = 8          # chunks per MCP call (one Ollama batch each). 8 (was 24, 2026-10-02): ~3 s on this CPU, so a 30 s embedding timeout survives a ~10x slowdown; layout chunks with tables run to 2,400 chars + breadcrumb
embed_retries               = 2          # an add_chunks batch the MCP answers "unavailable" (embedding failed, nothing stored) is sent again this often
embed_retry_backoff_s       = 5          # seconds before retry n is n times this (a CPU Ollama slowed 4x for minutes on 2026-10-01)
max_folders                 = 50         # per account
max_documents               = 500        # per account
folder_name_max_chars       = 60
title_max_chars             = 200
chunk_max_chars             = 4000       # the MCP refuses a longer chunk
processing_stale_s          = 1800       # a document still "processing" after this is shown as failed
router_titles_max           = 20         # uploaded document titles the router sees for a workspace
mine_max_chunks             = 400        # passages read when finding definitions in a workspace's documents

[workspaces]
# Workspaces and their knowledge store (docs/V3_PLAN.md Phase 3, migration 021).
max_per_principal           = 24         # was 12; raised 2026-10-03 for BIRD (11 workspaces) and the SEC study (2)
name_max_chars              = 60
business_context_max_chars  = 4000
description_max_chars       = 400
term_max_chars              = 60
question_max_chars          = 300
definitions_max             = 200
examples_max                = 500
# The scan: at most this many tables, and sample values from the first rows.
scan_max_tables             = 60
scan_sample_rows            = 50
scan_sample_values          = 5
# The setup test (D-v3-12). Sample datasets with a curated reference set are
# graded by execution accuracy against it; any other dataset is graded by the owner.
setup_questions             = 10
answer_max_chars            = 2000
questions_max_tokens        = 1200
# AI drafts of descriptions and definitions (the `decomposer` role).
draft_batch_chars           = 6000    # the catalog summary per model call
draft_max_tokens            = 4000
draft_attempts              = 2
draft_definitions_per_batch = 6
job_keep_s                  = 3600    # finished jobs stay readable this long
# Definitions found in uploaded documents (orchestrator/doc_definitions.py). Passages
# are scored for definitional wording in code; only the best, up to mine_max_chars in
# total, go to the model, in batches. A proposal is kept only if its quote is really
# in the cited passage.
mine_max_chars              = 24000   # ~6k tokens of passages per run, whatever the library's size
mine_batch_chars            = 6000    # passages per model call
mine_max_tokens             = 1500
mine_per_batch              = 8       # proposals the model may return per call
mine_quote_max_chars        = 400
mine_min_score              = 1       # a passage needs at least this much definitional wording
# What a question in a workspace gets (context assembly, slice 3).
context_max_examples        = 3
context_max_definitions     = 12
example_min_similarity      = 0.3
context_max_chars           = 6000    # the knowledge block added to the SQL agent's context

[workspaces.setup_sets]
# Reference questions per sample dataset, under fixtures/ (read-only). The test
# takes the first `setup_questions` English SQL questions of the set.
olist  = "golden/olist.json"
public = "golden/phase_c2.json"

[simulator]
# The live demo dataset (docs/V3_PLAN.md Phase 2b, migration 020, simulator/).
# Read by the simulator service only. The shop's fixed traits (cities,
# categories, channels, carriers, the hour-of-day curve) are in simulator/model.py.
tick_s                    = 5       # how often new data lands
backfill_days             = 30      # history created on the first start
retention_days            = 35      # older rows are deleted, so the schema stays small
prune_every_s             = 600
seed                      = 20260927
orders_per_minute_peak    = 5.0     # at the busiest hour (IST)
orders_per_minute_trough  = 0.6     # in the middle of the night
weekend_uplift            = 1.15
daily_growth              = 0.002   # a slow upward trend in the history
cancel_share              = 0.04
return_share              = 0.05
review_share              = 0.35
converting_session_s      = 420     # mean length of a visit that orders
browsing_session_s        = 240     # mean length of one that does not
customers                 = 40000

[retrieval]
chunk_target_tokens       = 512
chunk_overlap_tokens      = 64
semantic_top_k            = 8
semantic_top_k_max        = 25      # A4.6 vector.semantic_search input bound
embedding_model           = "mxbai-embed-large"  # E1: same model as memory's, own name per concern (A0.2)
embedding_dim             = 1024    # must match document_chunks.embedding VECTOR(1024), A5
embedding_timeout_s       = 30      # mcp -> ollama /api/embeddings HTTP timeout, ingestion + query-time
citation_max_chunks       = 3       # synthesizer: max kind:"chunk" citations deterministically emitted
# EXACT nearest-neighbour search (docs/V3_PLAN.md 0.12). The HNSW index on
# document_chunks.embedding is approximate, and measured on 2026-09-26 it was
# wrong in a way no tuning fixed: for a question naming FastShip 3 / LP003, the
# exact top match (LP003's annexure, cosine 0.77) was absent from the index's
# top 5 (review digests, ~0.55); raising hnsw.ef_search found it at 100 and 200
# and lost it again at 400. Exact search over the 20,245 chunks took 71 ms --
# noise next to a model call. true = vector queries run with index scans off
# for that one transaction. Revisit with a measured recall target if the
# corpus grows past what a sequential scan can serve.
exact_vector_search       = true
# Hybrid retrieval (docs/specs/rag_v2.md Phase D). mode is the default for a caller that
# does not pass one; the orchestrator always passes flags.toml [pipeline] retrieval_mode.
# "dense" = cosine only (today). "hybrid" = four ranked lists (dense and BM25, each over
# the sample corpus and over uploads), fused by reciprocal rank fusion.
mode                      = "dense"  # "dense" | "hybrid"
bm25_k1                   = 1.2      # BM25 term-frequency saturation
bm25_b                    = 0.75     # BM25 length normalisation
rrf_k                     = 60       # reciprocal rank fusion: score = sum 1 / (rrf_k + rank)
hybrid_candidates_per_leg = 50       # each of the four lists is cut to this many before fusing
bm25_stats_ttl_s          = 300      # the sample corpus's chunk count and mean length are cached this long, per tenant
# A query lexeme feeds a BM25 leg only if it occurs in at most this fraction of THAT leg's chunks
# (0 < df <= ratio * N, N and df counted in the leg's own corpus); a more common one neither gathers
# candidates nor adds score, and a leg left with no lexeme is empty. Why 0.5: the Robertson-Sparck
# Jones relevance weight log((N - df + 0.5) / (df + 0.5)), which BM25's IDF descends from, is <= 0
# once a term is in half the collection -- the model treats it as no evidence of relevance, and the
# "1 +" inside BM25's IDF only keeps scores non-negative. Phase D measured the cost of not doing so:
# "seller" and "custom" are in 99.9% of the 20,245 sample chunks and filled the keyword list's tail
# with arbitrary chunks that RRF then ranked above the true top hit. 1.0 = keep every lexeme with
# df >= 1 (the Phase D behaviour). Fixed in docs/specs/rag_v2.md D4 before measuring; not tuned.
bm25_max_df_ratio         = 0.5
# How hybrid mode hands the two dense lists (sample corpus, uploads) to RRF (docs/specs/rag_v2.md F0, "D5").
# "separate" = two lists (D3 as first specified; shipped). "merged" = one list, the candidates of both
# sorted by cosine, which is how dense mode already merges them. They share a model and a cosine, so
# the scores compare; as two lists, a sample chunk at rank 1 and an upload at rank 1 tie at 1/61 and
# the tie goes to list order (under doc_scope = "dataset" that cost three upload table questions rank 1
# in the layout_hybrid_scoped run). The BM25 lists stay separate in both: N and df differ per corpus.
# POST-HOC: added after the Phase E results on the frozen test set, so it was not pre-registered and
# its measured effect (the final_* runs in docs/eval/retrieval_v2_report.md) is on the set that
# motivated it. best_dense_score is the same in both. Restart mcp after changing it.
hybrid_dense_lists        = "separate"  # "separate" | "merged"
# Re-ranking (docs/specs/rag_v3.md; pipeline.rerank, shipped "off"). With a re-ranker on, the search
# fetches this many candidates, the reranker service re-scores them with a cross-encoder, and the top_k
# come back in its order. Fixed before measuring; not tuned.
rerank_candidates         = 30
rerank_timeout_s          = 120      # mcp -> reranker HTTP timeout; on timeout or error the un-reranked order is used. 120 (owner: accuracy over latency): bge on the Docker CPU took 50-57 s for 30 candidates under load
query_rewrite_max_tokens  = 200      # pipeline.query_rewrite = "llm": room for the normaliser model's one-line search query (reasoning models spend some first)
query_rewrite_max_chars   = 300      # a longer reply is not a search query: the original question is searched instead
# Abstention (docs/specs/rag_v2.md Phase E; pipeline.doc_abstain = "on"). The docs route gives up,
# without a model call, when the FIRST retrieval round's best dense cosine is below abstain_min_dense
# AND its best BM25 score is below abstain_min_keyword (a missing score counts as below). The fused
# RRF score is never used: it is ~0.03 for answerable and unanswerable questions alike.
# Thresholds: chosen by scripts/calibrate_abstention.py on 2026-10-01 from the saved run
# layout_hybrid_scoped (hybrid mode, doc_scope = "dataset", chunker = "layout") ON THE FROZEN TEST
# SET ITSELF, so they are an in-sample fit and not a held-out estimate. Rule: the pair that abstains
# the most unanswerable questions while abstaining at most 2 answerable ones. Result: 1 of 10
# unanswerable abstained, 0 of 100 answerable. The scores of unanswerable and answerable questions
# overlap (unanswerable best dense 0.57-0.73 against answerable 0.54-0.87), so this is a weak
# filter: it catches the clearest miss and nothing more. In dense mode only min_dense decides
# (the keyword score is missing); the dense-only optimum on layout_dense_scoped is the same
# min_dense with 1 of 10 and 1 of 100.
abstain_min_dense         = 0.5767178798791651
abstain_min_keyword       = 8.781194941742484
abstain_message           = "I couldn't find this in the documents available to this question."

# Which sample-corpus documents belong to which dataset (pipeline.doc_scope = "dataset"): a sample
# chunk is kept only if its document_id STARTS WITH one of the dataset's prefixes (matched with
# starts_with, never LIKE: "_" is a LIKE wildcard). Checked against the 11 distinct prefixes in
# document_chunks on 2026-10-01: doc_policy_{data,dispute,returns,seller}_, doc_review_digest_,
# doc_sla_annexure_, doc_sop_{cold,customer,delivery,warehouse}_, doc_supplier_agreement_.
# A dataset that is not listed, one with an empty list, and a connected database (cn_ + 16 hex)
# get no sample documents. Uploads are never filtered here: the workspace's folders scope them.
[retrieval.dataset_document_prefixes]
public = ["doc_policy_", "doc_sop_", "doc_supplier_agreement_", "doc_sla_annexure_"]
olist  = ["doc_review_digest_"]
live   = []

[scoring]
recall_weight             = 0.70    # spec score; recall over precision per VegaChat
precision_weight          = 0.30
mark_weight               = 0.40
encoding_weight           = 0.45
transform_weight          = 0.15
# ExecutionAccuracyScorer (BIRD/Spider "EX"). SQL result order is unspecified
# without ORDER BY, so the published definition compares result sets
# order-insensitively; set true only for a fixture whose ground truth pins an
# order and means it.
ex_order_sensitive        = false

[evaluation]
scorers                   = ["spec", "execution"]
golden_run_schedule_cron  = "0 * * * *"
history_retention_runs    = 200
# F1 Scope: "the Scorer registry with SpecScorer and ExecutionScorer
# registered and enabled" -- these name the fixtures whose shape matches
# each registered scorer's own need (reference_spec for spec, ground_truth_sql
# for execution). See docs/spec-gaps.md GAP-8 for why "the full golden set"
# is defined this way, since F1 Scope does not itself name a fixture.
spec_scorer_fixture       = "phase_e2.json"
execution_scorer_fixture  = "phase_c2.json"
history_default_limit     = 20      # GET /history default page size
# Per-query HTTP budget for the evaluation pipeline. Deliberately NOT derived
# from mcp.statement_timeout_ms: that bounds a single SQL statement, whereas a
# pipeline query is a full graph traversal (normalize + route + generate +
# execute + synthesize, several LLM calls). Reusing the MCP timeout gave 75s,
# under which 15 of 150 spec queries (10%) timed out across the 5-run trend.
query_timeout_s           = 300

# D11 Vision Score. A sub-table of [evaluation], so it must follow every
# bare [evaluation] key -- TOML closes a table when the next header appears.
# `model` is empty until a vision-capable model exists in the deployment, and
# is deliberately NOT defaulted to a text model: a text model asked to judge a
# picture it cannot see returns a confident, meaningless number.
[evaluation.vision_scorer]
model                     = ""
render_scale              = 2.0     # PNG scale factor passed to vl-convert
mark_weight               = 0.40    # mirrors the deterministic scorer's split
encoding_weight           = 0.45
readability_weight        = 0.15

[tenancy]
default_tenant            = "t_capstone_default"
enforced                  = false   # D6; threading is mandatory even when false
# Admission control for tenancy.enforced=true. A tenant_id outside this list is
# refused at the MCP boundary rather than silently served an empty result set,
# so a typo in X-Tenant-ID surfaces as an error instead of as "no data".
allowed_tenants           = ["t_capstone_default"]
# The relational business tables (orders, sellers, fulfillments, ...) carry NO
# tenant discriminator column, so they CANNOT be row-isolated. Only the
# document plane (documents, document_chunks) and the trajectory plane carry
# tenant_id. Enabling enforcement while the relational plane is shared is a
# real decision with real consequences, so it must be stated explicitly here;
# startup refuses otherwise rather than implying an isolation that does not
# exist. Adding tenant_id to the relational tables would change the A5 schema
# fingerprint and invalidate every stored trajectory under D4 -- see
# docs/open_items.md.
relational_plane_shared_ack = false

[api]
# Maximum requests allowed per principal in a fixed rate-limiting window.
# Bounds token expenditure and prevents denial-of-wallet loops on expensive
# graph executions while preserving high headroom for interactive query bursts.
rate_limit_max_requests   = 30
# The separate budget for every route that does NOT run the model: reads, tile
# and dashboard edits, a live dashboard polling itself (Phase 2b). Sized for a
# dashboard refreshing every 15 s with a build in progress, with headroom; it
# still bounds how hard one principal can drive the database.
read_rate_limit_max_requests = 300
# Duration of the fixed rate-limiting window in seconds. Balances rapid window
# rollover for bursty exploration with effective throttling against sustained
# high-throughput automated abuse.
rate_limit_window_seconds = 60
# Permitted browser origins for cross-origin orchestrator requests. The previous
# configuration used allow_origins=["*"], but a wildcard origin is incompatible
# with credentialed requests and unsafe for authenticated APIs. The frontend is
# served on port 3000 in development.
cors_allowed_origins      = ["http://localhost:3000", "http://127.0.0.1:3000"]
# The web app's HttpOnly session cookie (orchestrator/session_api.py) lasts this long; then
# the user signs in again. The token itself does not expire (README, Limitations).
session_cookie_max_age_s  = 604800   # 7 days
# UX allowlist so a bad value returns a clean 422 instead of a 500; the
# AUTHORITATIVE check is mcp/tools/schema_tools.py::_validate_schema, which
# validates server-side and cannot be bypassed by the orchestrator. If the two
# lists ever drift, MCP wins and the caller gets an error — never a silent
# fallback to another corpus.
allowed_schemas           = ["public", "olist", "live"]

[experiment]
# F-V2 over-exposure experiment (M9). Surface sizes reuse mcp.tool_ceiling's
# own scale (9 = current registered tool count, 15 = the configured ceiling)
# as decoy-capability-count targets injected into the Supervisor's own
# classification prompt -- see docs/spec-gaps.md GAP-7 for why: M9 measures
# Supervisor ROUTING accuracy, and D1 decoupled that 3-route classification
# from MCP's own tool list, so the surface that can actually move this
# metric is the Supervisor's own prompt, not MCP's registered RPC methods.
tool_ceiling_surfaces        = [9, 15, 25, 40]
tool_ceiling_runs_per_level  = 5
# Stratified subsample (not the full 60) for local-model runtime -- 4/route,
# 4 levels x 5 runs x 12 queries = 240 calls vs 1200 for the full set.
# Reasoned tradeoff, recorded in docs/phase_f_log.md; the F-V2 BASELINE
# measurement (single pass, the actual >=90% pass condition) always runs
# the full 60-query set.
tool_ceiling_subsample_per_route = 4

[models]
temperature               = 0.0
seed                      = 20260807
# LLM provider choice is set in flags.toml; model name is also there.
ollama_timeout_s          = 120     # generous — local inference can be slow
ollama_tags_timeout_s     = 5       # startup check that the configured local models exist (V3_PLAN 0.4)
# Azure OpenAI. Much shorter than the local timeout: a hosted frontier model
# answering in 120s means something is wrong, not that it is thinking.
azure_timeout_s           = 60
# The SDK retries 429/5xx itself. Kept low deliberately -- a graded run that
# silently retries is a graded run whose token accounting is wrong.
azure_max_retries         = 2
# Gemini. The FREE tier is limited per MINUTE, and a full fixture run issues
# ~5.2 LLM calls per query, so 429s are expected mid-run rather than
# exceptional. Retries use exponential backoff from the base delay below.
# Scoring a rate limit as a wrong answer would be a pure measurement artifact.
gemini_timeout_s          = 120
gemini_max_retries        = 5
gemini_retry_base_delay_s = 4.0
# Gemini 3.x are THINKING models and thinking tokens count against
# max_output_tokens. "minimal" is the only control that actually zeroes them on
# gemini-3.6-flash (thinking_budget=0 is rejected; thinking_budget=N does not
# constrain; "low" still spends ~119). Empty string omits the parameter.
# Raising this requires raising the [sql] max_tokens_* caps too -- a BD under
# A0.3 -- because thinking silently eats the visible-output budget.
gemini_thinking_level     = "minimal"
# Groq. Per-minute TOKEN limits (8K/min per model on the owner's key) make 429s
# routine mid-question; the adapter waits for the server's retry-after, capped
# below, and falls back to doubling the base delay when none is sent.
groq_timeout_s                  = 60
groq_max_retries                = 6
groq_retry_base_delay_s         = 2.0
groq_retry_max_wait_s           = 60.0
# Stop retrying once waits would exceed this in total (fail fast instead of a
# question that hangs for minutes). 420 keeps today's behaviour (6 x ~60 s).
groq_max_total_wait_s           = 420.0
# Added to max_tokens for models in flags.llm.groq.reasoning_effort, so
# reasoning tokens cannot consume the visible-output budget.
groq_reasoning_headroom_tokens  = 1024
# CLIENT-SIDE PACING. The free tier's binding constraint is REQUESTS PER MINUTE,
# not per day -- measured from the AI Studio dashboard: Flash models 5 RPM /
# 20 RPD, Flash-Lite 15 RPM / 500 RPD, TPM 250K (peak use 19.9K, never close).
# The pipeline fires ~4 calls back to back per query, so with no pacing it
# exceeds 5 RPM on the FIRST query and every later 429 is self-inflicted.
# Retry-with-backoff reacts to that; pacing prevents it.
#
# Set to the LOWEST tier in use (Flash = 5). Raise to 15 when every configured
# model is Flash-Lite. A wrong value here costs throughput, never correctness.
gemini_rpm                = 5

# The passage re-ranker service (reranker/server.py, docs/specs/rag_v3.md).
[reranker]
threads                   = 4        # torch CPU threads
batch                     = 8        # passages per forward pass
max_tokens                = 512      # query + passage, truncated on the passage side (both models are trained at 512)
max_passages              = 64       # per request
max_query_chars           = 4000
max_request_bytes         = 2000000

# Table selection (docs/specs/table_selection.md; flags.toml [schema_retriever] provider = "linked").
# Fixed before measuring; not tuned on FIBEN.
[table_selection]
max_tables_full           = 20       # a schema this small is shown whole, as with provider "direct"
top_tables                = 8        # tables ranked by BM25 of the question against each table's card
max_tables_selected       = 14       # hard cap after adding foreign-key neighbours and approved-example tables
fk_hops                   = 1        # foreign-key hops added around the top tables (a retry widens by one more)
# v3 (docs/specs/table_selection.md, "v3 protocol"): the value index.
value_index               = "on"     # "on" | "off": distinct values of text columns rank the tables that hold them
value_index_values_per_column = 10000 # most frequent distinct values per text column; capped by [mcp] max_rows_hard_cap (5000)
value_index_scan_rows     = 100000   # rows read per column to find them (bounds the scan on a big table)
value_index_max_columns   = 500      # text columns indexed per schema at most
value_index_value_chars   = 100      # a longer value is cut before it is tokenised
value_index_max_words     = 4        # longer values are prose, not entities, and are not indexed
value_index_time_budget_s = 20       # building it may delay the first question on a schema by at most this
value_min_token_chars     = 3        # shorter question words never match a value
value_tables              = 2        # value-matched tables added after the top tables (never displacing them)
