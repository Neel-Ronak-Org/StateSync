# config/statesync.toml
# Every number, limit and fixed text StateSync uses, in one place (no limits are written into the code).
# Model choices and the Jev switch are in config/flags.toml.

# ── The documents engine (orchestrator/nodes/documents.py) ────────────────────
[retrieval]
semantic_top_k            = 8       # round 1 finds the files from this many passages; the answer writer reads this many
semantic_top_k_max        = 25      # round 2 returns up to this many passages from those files (the candidates Jev re-ranks)
jev_rerank_concurrency    = 8       # Jev requests at once (the API refuses 25 at once)
jev_rerank_text_chars     = 3000    # characters of each passage Jev reads
embedding_model           = "mxbai-embed-large"   # run by Ollama; passages and questions must use the same model
embedding_dim             = 1024    # its vector size; a vector of another size is an error
embedding_timeout_s       = 30      # one embedding call
exact_vector_search       = true    # compare every passage (exact cosine scan); an approximate index missed right passages
citation_max_chunks       = 3       # passage citations shown under an answer

# A two-source question narrowed to the companies in the SQL result (match_titles).
[hybrid]
entity_rows               = 5       # rows of the SQL result whose names are used
max_entities              = 5       # names at most
title_name_min_chars      = 4       # a title's company name shorter than this must match a name exactly ("3M")

# ── The router (orchestrator/front_door.py) ───────────────────────────────────
[front_door]
evidence_passages         = 20      # passages searched for the router's view of the documents
evidence_documents        = 5       # documents shown to the router, by best passage
excerpt_chars             = 300     # characters of each document's best passage
card_max_chars            = 4000    # the database card's length cap (a very wide database is cut here)
card_cache_max            = 32      # database cards kept in memory (per tenant and database)
card_cache_ttl_s          = 600     # a card is rebuilt after this many seconds, so new rows reach the router
coverage_max_values       = 40      # a text column with more distinct values than this is left out of the coverage line
coverage_max_chars        = 2500    # the coverage line's length cap
history_turns             = 3       # earlier turns the router reads
answer_start_chars        = 200     # characters of each earlier answer it reads
max_tokens                = 1500    # the LLM router's reply cap (fallback only)
jev_url                   = "https://opencode.ai/zen/v1/systemone"   # Jev's endpoint (key: secrets/opencode_api_key)
jev_model                 = "jev-1.13"
jev_timeout_s             = 30      # one Jev request
jev_retry_wait_s          = 5       # wait before the one retry after a rate limit or server error
jev_depends               = 0.5     # P(the documents part needs the database's answer first) at or above this: narrow
out_of_scope_message      = "This workspace's database and documents do not hold that, so I can't answer it from here."

[context_carry]
answer_chars              = 200     # characters of the previous answer quoted in a follow-up's context line

# ── The SQL agent and the answer writer ───────────────────────────────────────
[sql]
retry_max                 = 3       # corrected attempts after the first
timeout_retry_max         = 3       # timeouts tolerated before giving up
interrogation_max_samples = 4       # tables sampled before writing the final query
max_sql_length            = 8000    # longer SQL is refused by the safety gate
max_tokens_sql            = 1024
max_tokens_decomposer     = 512
max_tokens_synthesizer    = 1024
synthesizer_preview_rows  = 50      # result rows the answer writer reads
answer_max_chars          = 4000
chart_min_rows            = 2       # a chart needs at least 2 rows and 2 columns; a single figure is an answer, not a chart
chart_min_columns         = 2
chart_max_data_rows       = 5000    # rows attached to a chart
chart_max_transforms      = 8       # chart output schema limits (schemas/synthesizer_output.py)
chart_min_dimension       = 100
chart_max_width           = 1600
chart_max_height          = 1200

[models]
temperature               = 0.0     # the same question gets the same answer as far as the model allows
timeout_s                 = 60      # one model call
max_retries               = 6       # retries after a rate limit, server error or dropped connection
retry_base_delay_s        = 2.0     # first wait, doubled each retry, unless the server says how long
retry_max_wait_s          = 60.0    # longest single wait
max_total_wait_s          = 420.0   # give up after this much waiting in total
reasoning_headroom_tokens = 1024   # extra output budget for a reasoning model's thinking

# ── The MCP tool server (mcp/) ─────────────────────────────────────────────────
[mcp]
internal_schemas          = ["session_state", "workspace_docs", "search", "live_sim",
                             "pg_catalog", "information_schema", "pg_toast"]   # model SQL may never name these
tool_ceiling              = 20      # the server refuses to start with more tools than this
statement_timeout_ms      = 15000   # layer 2 of the gate: a query running longer is stopped
max_rows_default          = 1000    # rows a query returns
max_rows_hard_cap         = 5000
sample_rows_default_limit = 5       # rows in a table sample
sample_rows_hard_cap      = 20
sample_rows_max_columns   = 12
session_idle_timeout_ms   = 60000   # an idle transaction is closed
network_overhead_s        = 5       # added to a call's own time limit
connect_timeout_s         = 10
pool_min_size             = 2       # database connections kept open
pool_max_size             = 10
history_get_turns_hard_cap = 20
session_browser_list_limit = 50
session_browser_turn_limit = 100
history_row_preview_max   = 100     # rows stored with a turn, shown when a conversation is reopened
history_full_rows_enabled = true    # also store the full result (for "show all rows")
history_full_rows_max     = 1000
history_full_rows_max_bytes = 1048576
history_full_rows_retention_days = 30
history_prune_batch_limit = 200
history_append_max_attempts = 3
audit_detail_max_chars    = 500

# ── Workspaces ────────────────────────────────────────────────────────────────
[workspaces]
max_per_principal         = 24
name_max_chars            = 60
business_context_max_chars = 4000
description_max_chars     = 400     # one table or column note
term_max_chars            = 60
question_max_chars        = 300
definitions_max           = 200
examples_max              = 500
scan_max_tables           = 60      # tables read when a workspace is scanned
scan_sample_rows          = 50      # rows read per table to find sample values
scan_sample_values        = 5       # sample values kept per column (shown to the AI drafting the notes)
draft_batch_chars         = 6000    # catalog text per AI draft call
draft_max_tokens          = 4000
draft_attempts            = 2
draft_definitions_per_batch = 6
job_keep_s                = 3600    # a finished draft job is remembered this long
context_max_chars         = 6000    # approved knowledge added to the SQL writer's prompt
context_max_examples      = 3       # similar approved examples shown to the SQL writer
context_max_definitions   = 12
example_min_similarity    = 0.3     # word overlap for an approved example to count as similar

# ── Uploaded documents ────────────────────────────────────────────────────────
[library]
content_types             = ["application/pdf", "text/plain", "text/markdown"]
max_upload_bytes          = 20971520   # 20 MB
max_pages                 = 600
max_chars                 = 2000000
parse_timeout_s           = 60      # the parser's limits for one file (parser/server.py)
parse_memory_mb           = 768
parse_cpu_s               = 60
parser_request_timeout_s  = 90
chunk_chars               = 1400    # a passage: about 350 tokens, inside the embedding model's 512
chunk_overlap_chars       = 200     # consecutive passages of a page share this much, so a cut sentence is whole in one
chunk_min_chars           = 40      # shorter fragments (page numbers, running headers) are dropped
chunk_max_chars           = 4000    # the MCP refuses a longer passage
section_max_chars         = 300
embed_batch               = 8       # passages per embedding call
embed_retries             = 2
embed_retry_backoff_s     = 5
max_folders               = 50
max_documents             = 500
folder_name_max_chars     = 60
title_max_chars           = 200
processing_stale_s        = 1800    # a document still "processing" after this is shown as failed

# ── Connected databases (mcp/connections.py) ──────────────────────────────────
[connections]
max_per_principal         = 20
name_max_chars            = 60
host_max_chars            = 255
field_max_chars           = 128
password_max_chars        = 512
connect_timeout_s         = 5
pool_max                  = 2       # connections per connected database
pool_idle_s               = 300
sample_schemas_max        = 50
blocked_hosts             = ["postgres", "ollama", "mcp", "orchestrator", "parser", "frontend", "localhost"]   # StateSync's own services
sslmodes                  = ["disable", "prefer", "require", "verify-ca", "verify-full"]

# ── Pinned answers (dashboards) ───────────────────────────────────────────────
[tiles]
default_refresh_s         = 3600    # a pinned answer re-runs its SQL this often
min_refresh_s             = 15
max_refresh_s             = 604800
max_per_principal         = 60
result_max_rows           = 1000
result_max_bytes          = 1048576
title_max_chars           = 120

[dashboards]
max_per_principal         = 24
max_tiles_per_dashboard   = 24
name_max_chars            = 60
question_max_chars        = 300
grid_columns              = 12
grid_max_row              = 1000
tile_min_h                = 2
tile_max_h                = 40

# ── Accounts and the web API ──────────────────────────────────────────────────
[tenancy]
default_tenant            = "t_capstone_default"
enforced                  = false   # one owner's deployment; true turns on the per-tenant allowlist (mcp/session.py)
allowed_tenants           = ["t_capstone_default"]

[api]
rate_limit_max_requests   = 30      # questions per person per window (they spend model tokens)
read_rate_limit_max_requests = 300  # every other request
rate_limit_window_seconds = 60
cors_allowed_origins      = ["http://localhost:3000", "http://127.0.0.1:3000"]
session_cookie_max_age_s  = 604800  # a sign-in lasts a week
