# ─── Networks ────────────────────────────────────────────────────────────────
# Security property (A1): postgres & qdrant are ONLY on db_net.
# orchestrator is ONLY on app_net. An orchestrator process that tries to reach
# postgres gets "no route to host" at the network layer — verified by B-V3.
networks:
  db_net:
    driver: bridge
    internal: true   # no external routing; containers cannot reach the internet
  app_net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  evaluator_data:   # BD8: persisted evaluation history (SQLite), owned solely by evaluator

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── 1. postgres ────────────────────────────────────────────────────────────
  postgres:
    container_name: postgres
    image: statesync-postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["postgres", "-c", "log_statement=all"]
    networks:
      - db_net          # db_net ONLY — no app_net attachment (A1 isolation)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: statesync_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_migrator_password
      POSTGRES_DB: statesync
    secrets:
      - pg_migrator_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statesync_migrator -d statesync"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # pgvector extension is required for document_chunks.embedding (A5)
    # PostGIS image includes it; pgvector must be separately installed.
    # The migration job installs CREATE EXTENSION IF NOT EXISTS vector.

  # ── 2. qdrant ──────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.4
    restart: unless-stopped
    networks:
      - db_net          # db_net ONLY — no app_net attachment (A1 isolation)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 3. ollama (local model host) ───────────────────────────────────────────
  # Serves mxbai-embed-large (1024 dims) for trajectory/document embeddings
  # (A6, E1) to mcp -- mcp's OLLAMA_URL below is hardcoded to this service
  # (http://ollama:11434) and always reaches it, regardless of the flag one
  # line down.
  #
  # Generation (qwen2.5:7b) is DIFFERENT and NOT wired to this container by
  # default. orchestrator has no OLLAMA_URL env var at all; it falls back to
  # config/flags.toml's `llm.ollama_url`, which this repo ships pointing at
  # `http://host.docker.internal:11434` -- a NATIVE Ollama app on the
  # developer's host, not this container. **Corrected 2026-08-23 (cycle 006
  # D1, audit 006 F-006-6)** -- this comment previously claimed the container
  # served "qwen2.5:7b for generation to orchestrator... when
  # flags.llm.ollama_url points here," which is false on two counts as
  # shipped: this container has never had qwen2.5:7b pulled into it, and the
  # shipped flag does not point here. If you DO want the orchestrator to
  # generate against this container instead of a native host Ollama, pull
  # the chat model into it (`docker compose exec ollama ollama pull
  # qwen2.5:7b`) AND change `llm.ollama_url` to `http://ollama:11434` --
  # neither is done by default. See README.md's Ollama topology section for
  # the two supported setups and which env var governs which service.
  #
  # On BOTH networks, deliberately, and the comment that used to sit here
  # ("only mcp needs it; stays off app_net") was stale — it contradicted the
  # two lines directly below it. orchestrator is app_net-only (A1), so it can
  # only reach a container-hosted Ollama if that container is on app_net too
  # -- relevant if you DO repoint llm.ollama_url at this service, per above.
  # This is not an A1 isolation concern: A1's topology table covers postgres,
  # qdrant, mcp, orchestrator, frontend and evaluator, and ollama holds no
  # credentials and fronts no data. postgres/qdrant remain db_net-only, and
  # B-V3 (orchestrator cannot reach postgres) is unaffected — ollama does not
  # route between the two networks.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - db_net
      - app_net
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' 2>/dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── 4. mcp ─────────────────────────────────────────────────────────────────
  # Sole credential holder. Bridges db_net (to reach postgres/qdrant/ollama)
  # and app_net (to accept calls from orchestrator/evaluator).
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - db_net
      - app_net
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - POSTGRES_DSN=postgresql://statesync_reader:READER_PLACEHOLDER@postgres:5432/statesync
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - CONFIG_DIR=/app/config
    volumes:
      - ./config:/app/config:ro
    secrets:
      - pg_reader_password
      - pg_history_password
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 5. orchestrator ────────────────────────────────────────────────────────
  # Graph, agents, model API keys. ONLY on app_net — cannot reach db_net (B-V3).
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_net         # app_net ONLY — intentionally not on db_net
    environment:
      - ORCHESTRATOR_HOST=0.0.0.0
      - ORCHESTRATOR_PORT=8090
      - MCP_URL=http://mcp:8080
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      # Azure OpenAI (BD1 seam, provider = "azure"). Like the Anthropic key,
      # this is read ONLY when that provider is selected -- a stack running
      # provider="local" never opens it, so the placeholder file is harmless.
      - AZURE_OPENAI_API_KEY_FILE=/run/secrets/azure_openai_api_key
      - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      # Groq (provider = "groq", the v3 default -- docs/V3_PLAN.md 0.4).
      - GROQ_API_KEY_FILE=/run/secrets/groq_api_key
      - CONFIG_DIR=/app/config
      # Reference questions for a workspace's setup test (docs/V3_PLAN.md Phase 3).
      - FIXTURES_DIR=/app/fixtures
    volumes:
      - ./config:/app/config:ro
      - ./fixtures:/app/fixtures:ro
    secrets:
      - anthropic_api_key
      - azure_openai_api_key
      - gemini_api_key
      - groq_api_key
      - api_principals
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 6. frontend ────────────────────────────────────────────────────────────
  # The web app (web/, docs/V3_PLAN.md Phase 2): a React bundle served by nginx,
  # charts rendered via vega-interpreter (A7) under a CSP with no unsafe-eval.
  # web/entrypoint.sh writes ORCHESTRATOR_URL into /config.js and the CSP.
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "3000:80"
    environment:
      # Consumed by the BROWSER, not by this container. entrypoint.sh bakes it
      # into app.js, which runs on the user's machine, so it must be an address
      # the user's machine can resolve. `http://orchestrator:8090` is a
      # compose-network DNS name that only exists between containers -- the
      # browser cannot resolve it, and every query from the UI failed with
      # "TypeError: Failed to fetch". The published port is what the browser
      # can reach.
      #
      # Contrast the evaluator service below, which keeps
      # `http://orchestrator:8090`: that one really is container-to-container.
      - ORCHESTRATOR_URL=http://localhost:8090
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 7. evaluator ───────────────────────────────────────────────────────────
  # Continuous evaluation pipeline (full impl in Phase F; stub here).
  evaluator:
    build:
      context: ./evaluator
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_net
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8090
      - MCP_URL=http://mcp:8080
      - CONFIG_DIR=/app/config
      - FIXTURES_DIR=/app/fixtures
      - EVAL_DB_PATH=/app/data/eval_history.db
    volumes:
      - ./config:/app/config:ro
      - ./fixtures:/app/fixtures:ro
      - evaluator_data:/app/data
    depends_on:
      orchestrator:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8095/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── 8. simulator ───────────────────────────────────────────────────────────
  # Keeps the `live` demo dataset moving (docs/V3_PLAN.md Phase 2b, migration
  # 020): backfills 30 days on first start, then appends orders, deliveries,
  # reviews and web traffic every few seconds. Connects as statesync_simulator,
  # which can write to the live and live_sim schemas and nothing else.
  # db_net only: it talks to postgres and nothing talks to it.
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - db_net
    environment:
      - CONFIG_DIR=/app/config
      - POSTGRES_HOST=postgres
      - PG_SIMULATOR_PASSWORD_FILE=/run/secrets/pg_simulator_password
    volumes:
      - ./config:/app/config:ro
    secrets:
      - pg_simulator_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # main.py rewrites the heartbeat every tick; a stale one means it stopped.
      test: ["CMD-SHELL", "test -n \"$(find /tmp/heartbeat -mmin -1 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

# ─── Secrets ─────────────────────────────────────────────────────────────────
# In production replace with Docker Swarm / Vault secrets.
# For local dev, create these files before running:
#   echo "changeme" > secrets/pg_migrator_password
#   echo "changeme" > secrets/pg_reader_password
#   echo "changeme" > secrets/pg_history_password
#   echo "sk-ant-..." > secrets/anthropic_api_key
secrets:
  pg_migrator_password:
    file: ./secrets/pg_migrator_password
  pg_reader_password:
    file: ./secrets/pg_reader_password
  pg_simulator_password:
    # Phase 2b: statesync_simulator (migration 020), writes only to the live and
    # live_sim schemas. Mounted only into the simulator.
    file: ./secrets/pg_simulator_password
  pg_history_password:
    # Cycle 007: statesync_history, table-scoped to
    # session_state.conversation_turns only (migrations/011). Mounted only
    # into mcp -- the orchestrator never holds a DB credential (A1).
    file: ./secrets/pg_history_password
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  azure_openai_api_key:
    file: ./secrets/azure_openai_api_key
  gemini_api_key:
    file: ./secrets/gemini_api_key
  groq_api_key:
    file: ./secrets/groq_api_key
  api_principals:
    file: ./secrets/api_principals.json
