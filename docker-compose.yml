# docker-compose.yml: the six services of StateSync.
#
#   frontend      the web app (React, served by nginx)                      localhost:3000
#   orchestrator  the pipeline (graph.py); holds the model keys, no database password   localhost:8090 (override)
#   mcp           the tool server; the ONLY service with database passwords
#   postgres      StateSync's own data: workspaces, conversations, uploaded documents and their vectors (pgvector)
#   ollama        the embedding model (mxbai-embed-large) for documents and questions
#   parser        turns uploaded files into text, isolated
#
# The security idea is in the networks: the orchestrator (which runs the language models) cannot reach any
# database at all. It can only ask the MCP, and the MCP runs a model's SQL only through its read-only gate.

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  db_net:          # postgres, ollama and the MCP. Internal: no internet.
    driver: bridge
    internal: true
  app_net:         # the frontend, the orchestrator and the MCP
    driver: bridge
  parser_net:      # the orchestrator and the parser only. Internal: the parser reaches nothing.
    driver: bridge
    internal: true

volumes:
  postgres_data:
  ollama_data:

services:

  # ── postgres ───────────────────────────────────────────────────────────────
  postgres:
    container_name: postgres
    image: statesync-postgres            # postgres with pgvector (postgres/Dockerfile)
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["postgres", "-c", "log_statement=all"]
    networks:
      - db_net                           # db_net only: the orchestrator cannot route to it
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: statesync_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_migrator_password
      POSTGRES_DB: statesync
    secrets:
      - pg_migrator_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statesync_migrator -d statesync"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── ollama: the embedding model ────────────────────────────────────────────
  # Pull the model once: docker compose exec ollama ollama pull mxbai-embed-large
  ollama:
    image: ollama/ollama:0.32.9
    restart: unless-stopped
    networks:
      - db_net
    environment:
      - OLLAMA_KEEP_ALIVE=-1             # keep the model loaded: a cold load under load timed out a search
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' 2>/dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── mcp: the tool server ───────────────────────────────────────────────────
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - db_net                           # to postgres and ollama
      - app_net                          # to accept calls from the orchestrator
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - OLLAMA_URL=http://ollama:11434
      - CONFIG_DIR=/app/config
    volumes:
      - ./config:/app/config:ro
    secrets:
      - pg_reader_password               # the read-only login model SQL runs as
      - pg_history_password              # writes conversations, workspaces and documents
      - connection_key                   # encrypts the passwords of the owner's own databases
      - mcp_token                        # every call must carry it (mcp/service_auth.py)
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── orchestrator: the pipeline ─────────────────────────────────────────────
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_net                          # never db_net
      - parser_net
    environment:
      - ORCHESTRATOR_HOST=0.0.0.0
      - ORCHESTRATOR_PORT=8090
      - MCP_URL=http://mcp:8080
      - PARSER_URL=http://parser:8095
      - CONFIG_DIR=/app/config
    volumes:
      - ./config:/app/config:ro
    secrets:
      - api_principals                   # the sign-in tokens (hashed)
      - mcp_token
      - cheaperinference_api_key         # the language models (config/flags.toml)
      - opencode_api_key                 # Jev
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── parser: uploaded files to text ─────────────────────────────────────────
  # The most hostile input StateSync accepts, so: no network beyond the orchestrator, no secrets,
  # non-root, read-only filesystem, no capabilities, bounded memory and processes, and each PDF parsed
  # in a child process with its own limits (parser/server.py).
  parser:
    build:
      context: ./parser
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - parser_net
    environment:
      - CONFIG_DIR=/app/config
      - PARSER_PORT=8095
    volumes:
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 64

  # ── frontend: the web app ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "127.0.0.1:3000:80"
    environment:
      # Read by the BROWSER (web/entrypoint.sh writes it into config.js), so it is the address the
      # user's machine reaches the orchestrator at, not a container name.
      - ORCHESTRATOR_URL=http://localhost:8090
    volumes:
      - ./config/suggestions.json:/etc/statesync/suggestions.json:ro   # the suggested questions on an empty chat
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ─── Secrets ─────────────────────────────────────────────────────────────────
# Files in secrets/ (never committed; see secrets/README.md). Each is mounted only where it is needed.
secrets:
  pg_migrator_password:
    file: ./secrets/pg_migrator_password
  pg_reader_password:
    file: ./secrets/pg_reader_password
  pg_history_password:
    file: ./secrets/pg_history_password
  connection_key:
    file: ./secrets/connection_key
  mcp_token:
    file: ./secrets/mcp_token
  api_principals:
    file: ./secrets/api_principals.json
  cheaperinference_api_key:
    file: ./secrets/cheaperinference_api_key
  opencode_api_key:
    file: ./secrets/opencode_api_key
