# docker-compose.override.yml — dev overrides
# Applied automatically by `docker compose up` on top of docker-compose.yml.
# Exposes ports locally so developers can psql directly, inspect qdrant, etc.
# These ports are NOT exposed in docker-compose.yml (production).

version: "3.9"

services:
  postgres:
    ports:
      - "5433:5432"   # local psql for migrations and debugging

  qdrant:
    ports:
      - "6333:6333"   # qdrant REST API
      - "6334:6334"   # qdrant gRPC

  ollama:
    ports:
      - "11434:11434" # ollama REST API

  mcp:
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=DEBUG

  orchestrator:
    ports:
      - "8090:8090"
    environment:
      - LOG_LEVEL=DEBUG
      # Past-conversations browser: GET /sessions and GET /sessions/{id}.
      # DEV ONLY, and deliberately set HERE rather than in docker-compose.yml.
      # History is stored with no auth (V2_STRATEGY 3b -- scoped by
      # tenant_id + session_id only), so enumerating sessions on a shared
      # tenant would expose every user's questions and answers to every other
      # user. Safe on a single-user machine; not something to ship. The
      # orchestrator returns 404 on both routes unless this is set.
      - STATESYNC_SESSION_BROWSER=1

  evaluator:
    ports:
      - "8095:8095"
