# docker-compose.override.yml — dev overrides
# Applied automatically by `docker compose up` on top of docker-compose.yml.
# Exposes ports locally so developers can psql directly, inspect qdrant, etc.
# These ports are NOT exposed in docker-compose.yml (production), and here they are
# bound to 127.0.0.1 so they are reachable from this machine only, not the LAN.
# (postgres is left as it was: changing it would recreate the database container.)

services:
  postgres:
    ports:
      - "5433:5432"   # local psql for migrations and debugging

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"   # qdrant REST API
      - "127.0.0.1:6334:6334"   # qdrant gRPC

  # ollama: not published. The MCP reaches it on db_net; the host's own (native)
  # Ollama app already uses localhost:11434.

  mcp:
    ports:
      # 127.0.0.1 only: the MCP has no authentication of its own (it trusts the
      # X-Tenant-ID header from the orchestrator), so it must never be reachable
      # from the network (security review 2026-10-01).
      - "127.0.0.1:8080:8080"
    environment:
      - LOG_LEVEL=DEBUG

  orchestrator:
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - LOG_LEVEL=DEBUG

  evaluator:
    ports:
      - "127.0.0.1:8095:8095"
