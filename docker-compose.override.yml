# docker-compose.override.yml: development ports, applied automatically by `docker compose up`.
# Every port is bound to 127.0.0.1, so it is reachable from this machine only, never the network.

services:
  postgres:
    ports:
      - "127.0.0.1:5434:5432"   # psql for migrations and debugging (5433 is left for demo/local_shop_db.sh)

  mcp:
    ports:
      # The MCP trusts the orchestrator's identity headers once the service token matches; it must never be
      # reachable from the network.
      - "127.0.0.1:8080:8080"

  orchestrator:
    ports:
      - "127.0.0.1:8090:8090"   # the API the web app calls from the browser
