[project]
name = "statesync-orchestrator"
version = "0.1.0"
description = "StateSync Orchestrator — Phase B Walking Skeleton"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "anthropic>=0.28.0",
    "jsonschema>=4.22.0",
    "tomllib>=2.0.0 ; python_version < '3.11'",
    "digipin>=2.1.1",
    # Same parser the mcp Layer-1 gate uses (A4.5). Here it is read-only and
    # non-security-bearing: sql_agent parses its own draft SQL to learn which
    # tables to interrogate. Version-matched to mcp/pyproject.toml on purpose.
    "pglast>=6.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
