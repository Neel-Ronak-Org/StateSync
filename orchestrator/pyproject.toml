[project]
name = "statesync-orchestrator"
version = "0.1.0"
description = "StateSync Orchestrator — Phase B Walking Skeleton"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "anthropic>=0.28.0",
    "jsonschema>=4.22.0",
    "tomllib>=2.0.0 ; python_version < '3.11'",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
