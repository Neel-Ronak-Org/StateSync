[project]
name = "statesync-orchestrator"
version = "0.1.0"
description = "StateSync orchestrator: the question-answering pipeline"
requires-python = ">=3.12"
# Compatible ranges; the exact versions an image installs are in requirements.lock.
dependencies = [
    "fastapi>=0.141.1,<0.143",
    "uvicorn[standard]>=0.52.3,<0.55",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13.4,<3",
    "langgraph>=1.2.11,<2",
    "langchain-core>=1.5.5,<2",
    # Every language model is reached through an OpenAI-compatible endpoint (llm/adapters/).
    "openai>=3.1.0,<4",
    "jsonschema>=4.26.0,<5",
    # The same SQL parser the MCP's safety gate uses; here it only reads which tables a draft query uses.
    "pglast>=8.4,<9",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.1,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
