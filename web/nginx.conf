# StateSync web -- nginx config.
#
# SECURITY HEADERS LIVE AT SERVER LEVEL ONLY, and no location block declares an
# add_header. nginx does NOT inherit server-level add_header into a location that
# declares one of its own; the previous frontend lost all four security headers
# on every path that way for a whole cycle (docs/audits/005.md F-005-1). Caching
# is therefore set with `expires`, which is not add_header and keeps inheritance
# intact. tests/test_nginx_header_checks.py pins both rules.
#
# CSP, stricter than the previous frontend's:
# - script-src 'self' only: no CDN (Vega is bundled), no inline script, and no
#   'unsafe-eval' -- charts render through vega-interpreter.
# - style-src keeps 'unsafe-inline': React and Radix position popovers, and the
#   dashboard grid places tiles, with style attributes. Inline style is not a
#   script-execution primitive.
# - font-src 'self': fonts are self-hosted, so Google Fonts is gone too.
# - connect-src is the orchestrator's origin, filled in at start-up from
#   ORCHESTRATOR_URL by entrypoint.sh (placeholder below).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' __ORCHESTRATOR_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The HTML shell and runtime config must always revalidate, or a browser
    # keeps running an old bundle after a deploy.
    location = /index.html { expires -1; }
    location = /config.js  { expires -1; }
    location = /build-info.json { expires -1; }

    # Hashed bundle files never change under a name; cache them for a long time.
    location /assets/ { expires 1y; try_files $uri =404; }

    location = /nginx-health { access_log off; default_type text/plain; return 200 'ok'; }

    # Single-page app: unknown paths serve the shell.
    location / { expires -1; try_files $uri /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
