# StateSync CI: every check that needs no running stack.
#
#   deterministic   Python: the settings lint (no limits written into the code) and the full test suite
#                   (tests/), with the dependencies of both services installed from their manifests.
#   web             the web app: lint, types, unit tests, and the browser suite with the API mocked.
#
# Not run here, because they need the whole stack and a model provider: the live demo check
# (scripts/check_demo.py) and the live checks in scripts/verify_*.py. The last step says so in the log.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deterministic:
    name: Deterministic gates (no stack required)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive requirements from orchestrator/ and mcp/'s pyproject.toml
        # Both services' manifests, merged, so the tests run with exactly what the images declare; a package
        # pinned differently in the two fails here rather than one silently winning.
        run: |
          python - <<'PY' > /tmp/requirements-ci.txt
          import tomllib, pathlib
          seen = {}
          for manifest in ("orchestrator/pyproject.toml", "mcp/pyproject.toml"):
              data = tomllib.loads(pathlib.Path(manifest).read_text())
              for dep in data["project"]["dependencies"]:
                  # Keyed on the package name (before any version specifier), so
                  # the two manifests naming the same package at different pins
                  # fails loudly here rather than one silently shadowing the
                  # other inside a merged pip install.
                  import re
                  name = re.split(r"[><=\[]", dep, maxsplit=1)[0].strip()
                  if name in seen and seen[name] != dep:
                      raise SystemExit(
                          f"dependency conflict across manifests: {name!r} is "
                          f"{seen[name]!r} in one and {dep!r} in the other -- "
                          "pin them to agree before this can merge cleanly."
                      )
                  seen[name] = dep
          for dep in seen.values():
              print(dep)
          PY
          printf "pytest\npackaging\npypdf\nreportlab\n" >> /tmp/requirements-ci.txt   # test-only: the lock and parser tests
          cat /tmp/requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /tmp/requirements-ci.txt

      - name: Settings lint (no configurable numbers written into the code)
        run: ./scripts/lint-no-literals.sh

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

      - name: State what CI did NOT cover
        if: always()
        run: |
          cat <<'EOF'
          ============================================================
          NOT COVERED BY CI (needs the full stack, run locally):
            docker compose up -d
            python3 scripts/verify_deployed.py   # the running images match the repository
            python3 scripts/check_demo.py        # the demo questions, end to end
            cd web && STATESYNC_LIVE=1 npx playwright test
          ============================================================
          EOF

  web:
    name: Web app (lint, types, build, mocked browser suite)
    # The UI acceptance bar. web/e2e/mocked runs the built app with the API
    # stubbed, so it needs no stack; without this job a frontend-only change
    # would re-check nothing (audit 004 F-004-2). The build step inside it runs
    # tsc, and lint carries the HTML-sink and eval bans.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (includes the HTML-sink and eval bans)
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (the presentation layer, layout, parsers)
        run: npm run test:unit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Mocked browser suite (builds and previews the app first)
        run: npx playwright test

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
