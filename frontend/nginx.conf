server {
    listen 80;
    server_name _;

    # ── CSP — unsafe-eval BLOCKED (A7 requirement) ───────────────────────────
    # The frontend renders Vega-Lite using vega-interpreter (the CSP-safe
    # expression interpreter), NOT the default expression compiler which uses
    # Function construction. This header is what makes E2-V4 pass rather than
    # merely appear to pass (A7 spec, verbatim).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8090 http://orchestrator:8090; img-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

    # No unsafe-eval in script-src — Function() construction is blocked.
    # No unsafe-inline in script-src either: the app moved to app.js so this
    # directive could be dropped. 'unsafe-inline' is what would have made the
    # trace-renderer innerHTML sink executable before that sink was fixed;
    # removing it means a future DOM-injection bug cannot reach script
    # execution. style-src keeps 'unsafe-inline' — the page's <style> block is
    # still inline, and inline STYLE is not an execution primitive.

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    # No Cache-Control was ever set, so browsers apply RFC 7234 heuristic
    # freshness to index.html/app.js from Last-Modified alone -- a browser
    # that loaded the app once can keep serving that copy from disk cache
    # on later navigations (even a hard reload, in the sandboxed browser
    # this project's own verification runs in) without ever revalidating,
    # while curl and a fresh profile see the current file immediately.
    # Audit 003 B1: this is "repo != running image" one layer further out --
    # the container had the fix, nginx served it correctly on every direct
    # request, and the browser still rendered the old app.js. A user who
    # loaded the app before a deploy would silently keep running the old
    # frontend code indefinitely. no-cache forces revalidation (a
    # conditional GET, still cheap via ETag/Last-Modified) on every load;
    # this app has no versioned asset filenames to cache-bust with instead.
    #
    # Audit 005 F-005-1: nginx does NOT inherit a server-level add_header into
    # a location block that declares any add_header of its own -- these two
    # blocks did exactly that the moment Cache-Control was added, and every
    # response since 56a23bf carried zero of the four security headers above,
    # on every path (both / and /nonexistent internally redirect here via
    # try_files' SPA fallback). The four headers are repeated verbatim in both
    # blocks rather than exempted from this file's inheritance model, so a
    # future location added the same way does not silently repeat the bug --
    # tests/test_frontend_asset_checks.py pins the invariant directly.
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8090 http://orchestrator:8090; img-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /app.js {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8090 http://orchestrator:8090; img-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Substitute orchestrator URL at container start
    location / {
        # sub_filter replaces the placeholder in index.html with the actual
        # orchestrator URL (set via ORCHESTRATOR_URL env var in entrypoint.sh)
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    #
    # Same inheritance bug as /index.html and /app.js above: this block's own
    # `add_header Content-Type` already discarded the four server-level
    # security headers for this path too (verified live before this fix,
    # docs/audits/005.md F-005-1) -- lower stakes since it is not user-facing
    # HTML, but there is no reason to leave a second instance of the same bug
    # in the file that caused it.
    location /nginx-health {
        return 200 'ok';
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8090 http://orchestrator:8090; img-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Type text/plain;
    }

    # Gzip for performance
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}
