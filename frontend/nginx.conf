server {
    listen 80;
    server_name _;

    # ── CSP — unsafe-eval BLOCKED (A7 requirement) ───────────────────────────
    # The frontend renders Vega-Lite using vega-interpreter (the CSP-safe
    # expression interpreter), NOT the default expression compiler which uses
    # Function construction. This header is what makes E2-V4 pass rather than
    # merely appear to pass (A7 spec, verbatim).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8090 http://orchestrator:8090; img-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

    # No unsafe-eval in script-src — Function() construction is blocked.

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    # Substitute orchestrator URL at container start
    location / {
        # sub_filter replaces the placeholder in index.html with the actual
        # orchestrator URL (set via ORCHESTRATOR_URL env var in entrypoint.sh)
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Gzip for performance
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}
