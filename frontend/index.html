<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StateSync — ONDC Network Analytics</title>
  <meta name="description" content="Multi-agent analytics for ONDC network data. Ask questions in plain English and get structured answers powered by AI." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Vega stack, CSP-safe (A7 / E2-V4).
       Expressions are evaluated by `vega-interpreter`, handed to vega-embed as
       `expr` alongside `ast: true`, so the default expression COMPILER — which
       builds functions via `Function(...)` and would require `unsafe-eval` —
       is never invoked. The CSP in nginx.conf omits unsafe-eval, so if the
       compiler path were ever taken the render would fail loudly rather than
       silently succeed. That is what makes E2-V4 a real test.

       Three load-order/packaging facts, each established by testing this page
       in a browser rather than assumed:
         - vega-embed@6 bundles neither vega nor vega-lite; it needs both as
           globals, so they must load first.
         - `vega@5/build/vega-interpreter.min.js` does not exist (404). The
           interpreter is its own package, `vega-interpreter@1`, and it
           defines the bare global `expressionInterpreter`.
         - `vega-core.min.js` is not standalone — it omits bundled d3
           dependencies and throws on load, leaving `window.vega` empty. The
           full `vega@5` build is the one to use. It ships the compiler code,
           but `ast: true` + `expr` means that code is never reached; the CSP
           is what proves it. -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5/build/vega.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-interpreter@1/build/vega-interpreter.min.js"></script>

  <style>
    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --surface2:  #1a2236;
      --border:    #1e2d45;
      --accent:    #3b82f6;
      --accent2:   #6366f1;
      --success:   #10b981;
      --warning:   #f59e0b;
      --error:     #ef4444;
      --text:      #e2e8f0;
      --text-muted:#94a3b8;
      --radius:    12px;
      --mono:      'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; color: #fff;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    header p  { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .phase-badge {
      margin-left: auto;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      color: var(--accent);
      font-size: 0.7rem; font-weight: 600;
      padding: 0.25rem 0.6rem; border-radius: 20px;
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    /* ── Query panel ── */
    .query-panel {
      border-right: 1px solid var(--border);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .panel-title {
      font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    /* Query suggestions */
    .suggestions { display: flex; flex-direction: column; gap: 0.5rem; }
    .suggestion-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.8rem; font-family: 'Inter', sans-serif;
      text-align: left; cursor: pointer;
      transition: all 0.15s;
    }
    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--surface2);
    }

    /* Query input area */
    .query-form { display: flex; flex-direction: column; gap: 0.75rem; }
    #query-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 1rem;
      resize: vertical;
      min-height: 100px;
      transition: border-color 0.15s;
      outline: none;
    }
    #query-input:focus { border-color: var(--accent); }
    #query-input::placeholder { color: var(--text-muted); }

    #submit-btn {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 8px;
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 0.875rem; font-weight: 600;
      padding: 0.65rem 1.5rem;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    }
    #submit-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    #submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* State trace (B-V2) */
    .trace-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.6;
      display: none;
    }
    .trace-card.visible { display: block; }
    .trace-key { color: var(--accent2); }
    .trace-value { color: var(--success); }

    /* ── Result panel ── */
    .result-panel {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Loading spinner */
    .loading {
      display: none;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .loading.visible { display: flex; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Answer card */
    .answer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: none;
    }
    .answer-card.visible { display: block; }
    .answer-header {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .answer-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
    }
    .answer-label {
      font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .latency-badge {
      margin-left: auto;
      font-size: 0.7rem; color: var(--text-muted);
    }
    #answer-text {
      font-size: 0.9rem; line-height: 1.7; color: var(--text);
    }
    .rewrite-note {
      display: none;
      font-size: 0.78rem; color: var(--text-muted);
      font-style: italic; margin-bottom: 0.75rem;
      padding-bottom: 0.75rem; border-bottom: 1px dashed var(--border);
    }
    .rewrite-note.visible { display: block; }

    /* Session/turn bar (cycle 007, Workstream A) */
    .session-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.75rem; color: var(--text-muted);
    }
    #new-conversation-btn {
      background: none; border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text-muted); font-size: 0.72rem; padding: 0.25rem 0.6rem;
      cursor: pointer;
    }
    #new-conversation-btn:hover { color: var(--text); border-color: var(--text-muted); }

    /* SQL display */
    .sql-card {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: none;
    }
    .sql-card.visible { display: block; }
    .sql-label {
      font-size: 0.65rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted); margin-bottom: 0.5rem;
    }
    #sql-text {
      font-family: var(--mono); font-size: 0.78rem;
      color: #c9d1d9; white-space: pre-wrap; word-break: break-all;
    }

    /* Citations display */
    .citations-card {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: none;
    }
    .citations-card.visible { display: block; }
    .citation-list {
      display: flex; flex-direction: column; gap: 0.4rem;
    }
    .citation-item {
      font-family: var(--mono); font-size: 0.75rem;
      color: #c9d1d9;
      display: flex; align-items: baseline; gap: 0.5rem;
    }
    .citation-kind {
      font-size: 0.62rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Error card */
    .error-card {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: none;
    }
    .error-card.visible { display: block; }
    #error-text { font-size: 0.85rem; color: var(--error); }

    /* Chart container (Phase E2 readiness) */
    #chart-container {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      min-height: 300px;
    }
    #chart-container.visible { display: block; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 0.75rem 2rem;
      font-size: 0.7rem; color: var(--text-muted);
      display: flex; gap: 2rem;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .query-panel { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">SS</div>
  <div>
    <h1>StateSync</h1>
    <p>ONDC Network Analytics</p>
  </div>
  <span class="phase-badge">Phase B</span>
</header>

<main>
  <!-- ── Query panel ── -->
  <section class="query-panel">
    <div class="panel-title">Ask a question</div>

    <div>
      <div class="panel-title" style="margin-bottom:0.5rem">Suggested queries</div>
      <div class="suggestions" id="suggestions">
        <button class="suggestion-btn" id="s1">How many orders were placed in Mumbai last month?</button>
        <button class="suggestion-btn" id="s2">Which sellers have the highest average order value?</button>
        <button class="suggestion-btn" id="s3">List logistics providers with more than 50 fulfillments.</button>
        <button class="suggestion-btn" id="s4">How many disputes were raised in the last 90 days?</button>
        <button class="suggestion-btn" id="s5">What are the top 5 cities by number of orders?</button>
      </div>
    </div>

    <!-- Cycle 007 (Workstream A): session/turn indicator, so a multi-turn
         conversation is visible, not just functionally present (V2_STRATEGY
         §7's demo bar). New conversation clears sessionStorage and mints a
         fresh session_id. -->
    <div class="session-bar" id="session-bar">
      <span id="turn-indicator">New conversation</span>
      <button type="button" id="new-conversation-btn">New conversation</button>
    </div>

    <form class="query-form" id="query-form">
      <textarea
        id="query-input"
        placeholder="Ask anything about the ONDC network data… (try a follow-up, like “and by state?”)"
        rows="5"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="submit-btn">Run Query</button>
    </form>

    <!-- State trace (for B-V2) -->
    <div>
      <div class="panel-title" style="margin-bottom:0.5rem">State trace</div>
      <div class="trace-card" id="trace-card"></div>
    </div>
  </section>

  <!-- ── Result panel ── -->
  <section class="result-panel">
    <div class="panel-title">Result</div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Running query through agent graph…</span>
    </div>

    <div class="error-card" id="error-card">
      <div class="sql-label">Error</div>
      <div id="error-text"></div>
    </div>

    <div class="answer-card" id="answer-card">
      <div class="answer-header">
        <div class="answer-dot"></div>
        <span class="answer-label">Answer</span>
        <span class="latency-badge" id="latency-badge"></span>
      </div>
      <div id="rewrite-note" class="rewrite-note"></div>
      <div id="answer-text"></div>
    </div>

    <div class="sql-card" id="sql-card">
      <div class="sql-label">Executed SQL</div>
      <pre id="sql-text"></pre>
    </div>

    <!-- Citations (chunk_id/page for retrieved document passages, kind:"sql"
         for the executed statement above) -- API always returns this array
         (E1-V4), previously computed and validated but never rendered to the
         page (audit 003 F-003-5, fixed cycle 003 B1).
         Labelled "Retrieved Context", not "Sources": build_citations lists
         the first citation_max_chunks retrievals in retrieval order with NO
         relevance filter against the answer -- on a retrieval miss it can
         list a document that supports nothing in the answer (audit 004
         F-004-5, live example in docs/limitations.md's M6 entry). Changing
         WHAT is listed here is out of scope: that would filter the exact
         retrieval set M6's context precision measures, which is a metric
         change, not a UI fix -- orchestrator/nodes/synthesizer.py's
         build_citations is deliberately untouched. -->
    <div class="citations-card" id="citations-card">
      <div class="sql-label">Retrieved Context</div>
      <div class="citation-list" id="citation-list"></div>
    </div>

    <!-- Chart container (Phase E2 readiness — hidden until chart data arrives) -->
    <div id="chart-container"></div>
  </section>
</main>

<footer>
  <span id="footer-status">Ready.</span>
  <span>StateSync v0.1.0-phase-b</span>
</footer>

<!-- ?v= is a manually-bumped cache-buster, not a build hash -- this project
     has no asset pipeline. nginx.conf's Cache-Control: no-cache (audit 003
     B1) makes a browser revalidate on every load going forward; this
     covers the case that fix cannot: a browser that already cached app.js
     under the OLD no-header rules, whose cache entry's own freshness
     lifetime was fixed at store time and is unaffected by a later
     Cache-Control change. Bump the date on any app.js edit. -->
<script src="app.js?v=20260820" defer></script>
</body>
</html>
