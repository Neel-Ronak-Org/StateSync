[project]
name = "statesync-mcp"
version = "0.1.0"
description = "StateSync MCP Tool Server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "pglast>=6.2",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
